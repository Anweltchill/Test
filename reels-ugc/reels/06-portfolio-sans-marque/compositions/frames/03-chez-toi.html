<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s3-cam { position: absolute; inset: 0; }
        #s3-l1 { position: absolute; left: 64px; right: 120px; top: 280px; text-align: center; font-size: 40px; display: block; }
        #s3-l2 { position: absolute; left: 64px; right: 120px; top: 340px; text-align: center; font-size: 104px; display: block; white-space: nowrap; }
        #s3-housew { position: absolute; left: 382px; top: 500px; width: 260px; height: 260px; display: block; }
        #s3-house { width: 260px; height: 260px; }
        .s3-p { position: absolute; top: 850px; width: 260px; height: 330px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
        #s3-p1 { left: 82px; }
        #s3-p2 { left: 382px; }
        #s3-p3 { left: 682px; }
        .s3-i { width: 170px; height: 170px; }
        .s3-n { font-size: 46px; display: block; }
      </style>
      <div id="root" data-composition-id="s3" data-width="1080" data-height="1920">
        <div id="s3-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s3-l1" class="t-label">Prends ce que tu as</span>
          <span id="s3-l2" class="t-serif">déjà <span class="acc">chez toi</span></span>
          <div id="s3-housew"><img id="s3-house" class="img3d" src="assets/lib/emoji/house-with-garden.png" alt="" /></div>
          <div id="s3-p1" class="s3-p card"><img class="s3-i img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /><span class="s3-n t-serif">Ta <span class="acc">crème</span></span></div>
          <div id="s3-p2" class="s3-p card"><img class="s3-i img3d" src="assets/lib/emoji/cup-with-straw.png" alt="" /><span class="s3-n t-serif">Ta <span class="acc">gourde</span></span></div>
          <div id="s3-p3" class="s3-p card"><img class="s3-i img3d" src="assets/lib/emoji/hot-beverage.png" alt="" /><span class="s3-n t-serif">Ton <span class="acc">café</span></span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 6.95, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « produits » 7.41 · « chez toi » 8.37–8.53 · « crème » 9.17 · « gourde » 9.81 · « café » 10.53
          tl.fromTo("#s3-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out" }, 0);
          tl.fromTo("#s3-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35 }, at(7.05));
          tl.fromTo("#s3-l2", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power4.out" }, at(8.25));
          tl.fromTo("#s3-house", { scale: 0, y: 120 }, { scale: 1, y: 0, duration: 0.55, ease: "back.out(2.4)" }, at(7.3));
          PX.float(tl, "#s3-housew", at(7.9), 3.0, 8, 1.2, 3);
          tl.fromTo("#s3-housew", { scaleX: 1, scaleY: 1 }, { scaleX: 1.1, scaleY: 0.9, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at(8.45));
          [["#s3-p1", 9.05], ["#s3-p2", 9.7], ["#s3-p3", 10.4]].forEach(([p, t], i) => {
            tl.fromTo(p, { x: 512 - [212, 512, 812][i], y: -380, scale: 0.2, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, at(t));
            tl.fromTo(p + " .s3-i", { rotation: -30 }, { rotation: 0, duration: 0.6, ease: "elastic.out(1, 0.5)" }, at(t + 0.2));
            PX.burst(tl, "#s3-cam", [212, 512, 812][i], 900, at(t + 0.35), { n: 8, r: 130, size: 14, seed: 60 + i });
          });
          tl.to("#s3-cam", { x: -1080, filter: "blur(16px)", duration: 0.22, ease: "power3.in" }, at(10.75));
          window.__timelines["s3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
