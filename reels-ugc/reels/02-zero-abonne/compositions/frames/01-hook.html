      <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div id="s1-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s1-prof" class="card">

            <div id="s1-big"><span id="s1-num" class="t-serif">12 450</span><span id="s1-ab">abonnés</span></div>

          <div id="s1-popw"><img id="s1-pop" class="img3d" src="assets/lib/emoji/party-popper.png" alt="" /></div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // « Zéro » 0.00 · « abonnés » 0.40 · « Parfait » 1.12 · « faire de l'UGC » 2.24–2.48
          tl.fromTo("#s1-prof", { scale: 0.7, opacity: 0, rotationX: 25 }, { scale: 1, opacity: 1, rotationX: 0, duration: 0.4, ease: "back.out(1.6)", transformPerspective: 1200 }, 0);
          const el = document.querySelector("#s1-num");
          const c = { _v: 12450, get v() { return this._v; }, set v(x) { this._v = x; el.textContent = Math.round(x).toLocaleString("fr-FR").replace(/ | /g, " "); } };
          tl.fromTo(c, { v: 12450 }, { v: 0, duration: 0.6, ease: "power3.in" }, 0.05);
          tl.fromTo("#s1-big", { scale: 1 }, { scale: 1.25, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 0.65);
          tl.fromTo("#s1-av", { y: 60 }, { y: 0, duration: 0.5, ease: "back.out(2)" }, 0.15);
          tl.fromTo("#s1-stamp", { scale: 2.6, opacity: 0, rotation: -16 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.3, ease: "power4.in" }, 0.85);
          tl.fromTo("#s1-cam", { x: 0 }, { x: 16, duration: 0.05, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, 1.15);
          PX.burst(tl, "#s1-cam", 520, 1030, 1.15, { n: 16, r: 330, seed: 3 });
          tl.fromTo("#s1-pop", { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.6)" }, 1.1);
          PX.float(tl, "#s1-popw", 1.6, 1.4, 10, 1.2, 4);
          tl.fromTo("#s1-ugc", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 1.8);
          tl.fromTo("#s1-spk", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, 2.2);
          tl.fromTo("#s1-cam", { scale: 1 }, { scale: 1.06, duration: 2.4, ease: "none", immediateRender: false }, 0.6);
          tl.to("#s1-cam", { x: -1080, filter: "blur(16px)", duration: 0.28, ease: "power3.in" }, 3.02);
          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
