<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s1-cam { position: absolute; inset: 0; }
        #s1-num { position: absolute; left: 64px; right: 120px; top: 330px; text-align: center; font-size: 300px; line-height: 1; white-space: nowrap; display: block; }
        #s1-lab { position: absolute; left: 64px; right: 120px; top: 650px; text-align: center; font-size: 56px; display: block; }
        #s1-stamp { position: absolute; left: 212px; top: 760px; width: 600px; height: 220px; border: 10px solid #E2718D; border-radius: 28px; display: flex; align-items: center; justify-content: center; }
        #s1-stampt { font-size: 112px; color: #E2718D; display: block; }
        #s1-ugc { position: absolute; left: 0; right: 56px; top: 1080px; text-align: center; display: block; }
        #s1-pill { display: inline-flex; align-items: center; gap: 18px; background: #0E1928; color: #FDF4ED; border-radius: 999px; padding: 18px 44px; font: 600 50px "PxSans", sans-serif; letter-spacing: 0.06em; }
        #s1-ck { width: 52px; height: 52px; display: block; }
      </style>
      <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div id="s1-cam" data-layout-allow-overflow>
          <div id="s1-num" class="t-serif">0</div>
          <div id="s1-lab" class="t-label">abonné</div>
          <div id="s1-stamp"><span id="s1-stampt" class="t-serif">Parfait.</span></div>
          <div id="s1-ugc"><span id="s1-pill"><svg id="s1-ck" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="28" fill="#E2718D" /><path d="M20 33l8 8 16-17" stroke="#FDF4ED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></svg>Tu peux faire de l'UGC</span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 0, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « Zéro » 0.00 · « abonnés » 0.40 · « Parfait » 1.12 · « faire de l'UGC » 2.24–2.48
          const el = document.querySelector("#s1-num");
          const c = { _v: 12450, get v() { return this._v; }, set v(x) { this._v = x; el.textContent = Math.round(x).toLocaleString("fr-FR").replace(/ | /g, " "); } };
          tl.fromTo(c, { v: 12450 }, { v: 0, duration: 0.55, ease: "power3.in" }, 0);
          tl.fromTo("#s1-num", { scale: 0.42 }, { scale: 1, duration: 0.55, ease: "power3.in" }, 0);
          tl.fromTo("#s1-num", { scale: 1 }, { scale: 1.12, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 0.56);
          tl.fromTo("#s1-lab", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at(0.35));
          tl.fromTo("#s1-stamp", { scale: 2.4, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.35, ease: "power4.in" }, at(0.85));
          tl.fromTo("#s1-cam", { x: 0 }, { x: 14, duration: 0.05, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, at(1.2));
          tl.fromTo("#s1-ugc", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(2)" }, at(1.75));
          tl.fromTo("#s1-ck", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, at(2.3));
          tl.fromTo("#s1-cam", { scale: 1 }, { scale: 1.05, duration: 2.6, ease: "none", immediateRender: false }, at(0.6));
          tl.to("#s1-cam", { x: -1080, filter: "blur(16px)", duration: 0.28, ease: "power3.in" }, at(3.02));
          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
