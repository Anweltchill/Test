<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s3-cam { position: absolute; inset: 0; }
        .s3-c { position: absolute; left: 72px; width: 880px; height: 300px; display: flex; align-items: center; gap: 40px; padding: 0 44px; }
        #s3-c1 { top: 320px; }
        #s3-c2 { top: 660px; }
        #s3-c3 { top: 1000px; }
        .s3-imgs { position: relative; width: 300px; height: 230px; flex: none; display: block; }
        .s3-a { position: absolute; left: 0; top: 10px; width: 200px; height: 200px; }
        .s3-b { position: absolute; left: 160px; top: 90px; width: 130px; height: 130px; }
        .s3-t { font-size: 70px; display: block; }
        .s3-k { font-size: 30px; color: #CC7183; display: block; margin-bottom: 8px; }
      </style>
      <div id="root" data-composition-id="s3" data-width="1080" data-height="1920">
        <div id="s3-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s3-c1" class="s3-c card">
            <div class="s3-imgs"><img class="s3-a img3d" src="assets/lib/emoji/mobile-phone.png" alt="" /><img class="s3-b logo-app" src="assets/lib/logos/instagram-icon.svg" alt="" /></div>
            <div><span class="s3-k t-label">Sur son</span><span class="s3-t t-serif">compte</span></div>
          </div>
          <div id="s3-c2" class="s3-c card">
            <div class="s3-imgs"><img class="s3-a img3d" src="assets/lib/emoji/megaphone.png" alt="" /><img class="s3-b logo-app" src="assets/lib/logos/meta-icon.svg" alt="" /></div>
            <div><span class="s3-k t-label">Dans ses</span><span class="s3-t t-serif">publicités</span></div>
          </div>
          <div id="s3-c3" class="s3-c card">
            <div class="s3-imgs"><img class="s3-a img3d" src="assets/lib/emoji/globe-with-meridians.png" alt="" /><img class="s3-b logo-app" src="assets/lib/logos/shopify.svg" alt="" /></div>
            <div><span class="s3-k t-label">Sur son</span><span class="s3-t t-serif">site</span></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 11.4, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « compte » 11.92 · « publicités » 12.72 · « site » 13.84
          tl.fromTo("#s3-cam", { y: 500, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
          [["#s3-c1", 11.45], ["#s3-c2", 12.45], ["#s3-c3", 13.3]].forEach(([c, t], i) => {
            tl.fromTo(c, { rotationY: 90, opacity: 0, x: i % 2 ? 200 : -200 }, { rotationY: 0, opacity: 1, x: 0, duration: 0.55, ease: "back.out(1.4)", transformPerspective: 1600 }, at(t));
            tl.fromTo(c + " .s3-a", { scale: 0.3, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.4)" }, at(t + 0.1));
            tl.fromTo(c + " .s3-b", { scale: 0, rotation: 120 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, at(t + 0.25));
            PX.burst(tl, "#s3-cam", 340, [470, 810, 1150][i], at(t + 0.3), { n: 8, r: 120, size: 16, seed: 20 + i });
          });
          tl.to("#s3-cam", { x: -1080, filter: "blur(16px)", duration: 0.25, ease: "power3.in" }, at(13.85));
          window.__timelines["s3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
