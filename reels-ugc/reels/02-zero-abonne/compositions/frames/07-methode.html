          tl.fromTo("#s7-path", { opacity: 0 }, { opacity: 1, duration: 0.3 }, at(28.3));

          });
          tl.to("#s7-cam", { x: -1080, filter: "blur(16px)", duration: 0.23, ease: "power3.in" }, at(30.62));
