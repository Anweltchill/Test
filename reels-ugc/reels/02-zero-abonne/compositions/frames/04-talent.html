<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s4-cam { position: absolute; inset: 0; }
        #s4-q { position: absolute; left: 64px; right: 120px; top: 280px; text-align: center; font-size: 46px; display: block; }
        #s4-vis { position: absolute; left: 152px; top: 380px; width: 720px; height: 260px; display: flex; align-items: center; justify-content: center; gap: 30px; }
        #s4-eyes { width: 190px; height: 190px; }
        #s4-vt { font-size: 80px; display: block; }
        #s4-xl { position: absolute; left: 130px; top: 480px; width: 764px; height: 70px; display: block; }
        #s4-tal { position: absolute; left: 64px; right: 120px; top: 760px; text-align: center; font-size: 160px; white-space: nowrap; display: block; padding-bottom: 14px; }
        #s4-starw { position: absolute; left: 400px; top: 690px; width: 230px; height: 230px; display: block; }
        #s4-star { width: 230px; height: 230px; }
        #s4-env { position: absolute; left: 64px; right: 120px; top: 1010px; text-align: center; font-size: 92px; display: block; padding-bottom: 12px; }
        #s4-facew { position: absolute; left: 444px; top: 1140px; width: 140px; height: 140px; display: block; }
        #s4-face { width: 140px; height: 140px; }
      </style>
      <div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
        <div id="s4-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s4-q" class="t-label">Ce qu'on te demande</div>
          <div id="s4-vis" class="card"><img id="s4-eyes" class="img3d" src="assets/lib/emoji/eyes.png" alt="" /><span id="s4-vt" class="t-serif">Visibilité</span></div>
          <svg id="s4-xl" viewBox="0 0 764 70" fill="none"><path id="s4-xp" d="M12 46 C 200 24, 500 54, 752 20" stroke="#E2718D" stroke-width="16" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="800" /></svg>
          <div id="s4-starw"><img id="s4-star" class="img3d" src="assets/lib/emoji/glowing-star.png" alt="" /></div>
          <div id="s4-tal" class="t-serif">ton talent</div>
          <div id="s4-env" class="t-italic">pour donner envie</div>
          <div id="s4-facew"><img id="s4-face" class="img3d" src="assets/lib/emoji/smiling-face-with-heart-eyes.png" alt="" /></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 14.1, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « demande » 14.96 · « visibilité » 15.92 · « talent » 17.12 · « donner envie » 17.68–18.00
          tl.fromTo("#s4-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, 0);
          tl.fromTo("#s4-q", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at(14.35));
          tl.fromTo("#s4-vis", { scale: 0.5, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.55, ease: "back.out(2)" }, at(14.9));
          tl.fromTo("#s4-eyes", { x: -30 }, { x: 30, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, at(15.0));
          tl.fromTo("#s4-xp", { attr: { "stroke-dashoffset": 800 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power3.out" }, at(16.3));
          tl.to("#s4-vis", { opacity: 0.35, scale: 0.9, rotation: -4, y: -30, duration: 0.4 }, at(16.45));
          tl.to("#s4-xl", { opacity: 0.35, y: -30, duration: 0.4 }, at(16.45));
          tl.fromTo("#s4-star", { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.7, ease: "back.out(2)" }, at(16.75));
          tl.fromTo("#s4-starw", { opacity: 1 }, { opacity: 0.25, duration: 0.3, immediateRender: false }, at(17.4));
          PX.letters(tl, "#s4-tal", at(16.9), { y: 120, stagger: 0.035 }).slice(4).forEach((c) => (c.style.color = "#E2718D"));
          PX.burst(tl, "#s4-cam", 515, 850, at(17.15), { n: 18, r: 380, seed: 5 });
          PX.letters(tl, "#s4-env", at(17.5), { y: 60, stagger: 0.02, dur: 0.4, ease: "power4.out" });
          tl.fromTo("#s4-face", { scale: 0, rotation: 30 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, at(17.85));
          PX.float(tl, "#s4-facew", at(18.0), 0.6, 8, 0.6, 5);
          tl.to("#s4-cam", { scale: 1.4, opacity: 0, filter: "blur(14px)", duration: 0.26, ease: "power3.in" }, at(18.14));
          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
