      <script>
        (function () {
          const T0 = 3.3, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#s2-A", { y: 140, opacity: 0, rotationX: -30 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.6, ease: "expo.out", transformPerspective: 1400 }, at(3.9));
          tl.fromTo("#s2-pa", { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2.2)" }, at(4.1));
          PX.float(tl, "#s2-paw", at(4.7), 6.0, 8, 1.6, 2);

          ["#s2-h1", "#s2-h2", "#s2-h3"].forEach((h, i) => {
            tl.fromTo(h, { scale: 0, y: 40 }, { scale: 1, y: 0, duration: 0.45, ease: "back.out(3)" }, at(6.45 + i * 0.1));
            PX.float(tl, h, at(6.95 + i * 0.1), 4.0, 7, 1.0 + i * 0.2, 6);
          });
          tl.to("#s2-A", { opacity: 0.5, scale: 0.96, duration: 0.4 }, at(7.0));
          tl.fromTo("#s2-vs", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, at(6.95));
          tl.fromTo("#s2-B", { y: 200, opacity: 0, rotationX: 30 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.6, ease: "expo.out", transformPerspective: 1400 }, at(7.05));
          tl.fromTo("#s2-pb", { scale: 0, rotation: 25 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2.2)" }, at(7.25));
          PX.float(tl, "#s2-pbw", at(7.85), 3.2, 8, 1.6, 2);
          tl.fromTo("#s2-b1", { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, at(8.75));
          tl.fromTo("#s2-b1 .s2-ic", { scale: 0.3, rotation: 40 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, at(8.8));
          tl.fromTo("#s2-b2", { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, at(10.15));
          tl.fromTo("#s2-b2 .s2-ic", { scale: 0.3, y: -60 }, { scale: 1, y: 0, duration: 0.5, ease: "back.out(3)" }, at(10.2));
          tl.fromTo("#s2-ok", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, at(10.9));
          PX.burst(tl, "#s2-cam", 902, 1180, at(10.95), { n: 12, r: 170, seed: 9 });
          tl.to("#s2-cam", { y: -400, scale: 1.25, opacity: 0, filter: "blur(14px)", duration: 0.3, ease: "power3.in" }, at(11.1));
          window.__timelines["s2"] = tl;
        })();
