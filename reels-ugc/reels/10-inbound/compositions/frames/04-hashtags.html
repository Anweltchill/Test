<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s4-cam { position: absolute; inset: 0; }
        #s4-post { position: absolute; left: 212px; top: 280px; width: 600px; height: 720px; display: block; overflow: hidden; }
        #s4-img { position: absolute; left: 24px; right: 24px; top: 24px; height: 470px; border-radius: 24px; background: linear-gradient(160deg, #E6BDC1, #DB96A1); display: flex; align-items: center; justify-content: center; }
        #s4-prod { width: 230px; height: 230px; }
        #s4-hand { position: absolute; left: 300px; top: 270px; width: 140px; height: 140px; }
        #s4-at { position: absolute; left: 50px; top: 400px; background: #0E1928; color: #FDF4ED; border-radius: 999px; padding: 8px 22px; font: 600 30px "PxSans", sans-serif; display: block; }
        #s4-cap { position: absolute; left: 30px; right: 30px; top: 520px; font: 400 32px/1.35 "PxSans", sans-serif; display: block; }
        .s4-hash { position: absolute; top: 620px; background: #FDF4ED; border: 3px solid #E2718D; color: #E2718D; border-radius: 999px; padding: 6px 20px; font: 600 30px "PxSans", sans-serif; display: block; }
        #s4-h1 { left: 30px; }
        #s4-h2 { left: 230px; }
        #s4-eyesw { position: absolute; left: 90px; top: 1060px; width: 170px; height: 170px; display: block; }
        #s4-eyes { width: 170px; height: 170px; }
        #s4-rep { position: absolute; left: 350px; top: 1060px; width: 560px; height: 180px; display: flex; align-items: center; gap: 22px; padding: 0 30px; }
        #s4-repi { width: 110px; height: 110px; flex: none; }

      </style>
      <div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
        <div id="s4-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s4-post" class="card">
            <div id="s4-img"><img id="s4-prod" class="img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /><img id="s4-hand" class="img3d" src="assets/lib/emoji/thumbs-up.png" alt="" /><span id="s4-at">@brandx</span></div>
            <span id="s4-cap">Ma routine du matin avec ma crème préférée</span>
            <span id="s4-h1" class="s4-hash">#brandx</span>
            <span id="s4-h2" class="s4-hash">#brandxroutine</span>
          </div>
          <div id="s4-eyesw"><img id="s4-eyes" class="img3d" src="assets/lib/emoji/eyes.png" alt="" /></div>
          <div id="s4-rep" class="card"><img id="s4-repi" class="img3d" src="assets/lib/emoji/repeat-button.png" alt="" /><span id="s4-rept" class="t-serif">Brand X a <span class="acc">partagé</span> ta vidéo</span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 16.9, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « identifies » 17.20 · « utilises les produits » 18.48–18.96 · « hashtag » 19.84 · « remarquent » 21.04 · « partagent » 21.92
          tl.fromTo("#s4-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, 0);
          tl.fromTo("#s4-post", { y: 400, opacity: 0, rotationX: -25 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.5, ease: "expo.out", transformPerspective: 1400 }, at(17.0));
          tl.fromTo("#s4-at", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(3)" }, at(17.3));
          tl.fromTo("#s4-prod", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.5)" }, at(18.4));
          tl.fromTo("#s4-hand", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(18.9));
          tl.fromTo("#s4-cap", { opacity: 0 }, { opacity: 1, duration: 0.3 }, at(19.1));
          tl.fromTo("#s4-h1", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(19.75));
          tl.fromTo("#s4-h2", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(19.95));
          tl.fromTo(".s4-hash", { scale: 1 }, { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", stagger: 0.12, immediateRender: false }, at(20.3));
          tl.fromTo("#s4-eyes", { scale: 0, y: 80 }, { scale: 1, y: 0, duration: 0.4, ease: "back.out(3)" }, at(20.9));
          tl.fromTo("#s4-eyesw", { x: 0 }, { x: 30, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, at(21.3));
          tl.fromTo("#s4-rep", { x: 600, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, at(21.8));
          tl.fromTo("#s4-repi", { rotation: -180, scale: 0 }, { rotation: 0, scale: 1, duration: 0.5, ease: "back.out(2.5)" }, at(21.9));
          PX.burst(tl, "#s4-cam", 630, 1150, at(22.1), { n: 12, r: 220, size: 14, seed: 46 });
          tl.to("#s4-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(22.3));
          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
