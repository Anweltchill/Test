      <script>
        (function () {
          const T0 = 22.5, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « TikTok » 22.96 · « tendances » 24.40 · « opportunités » 25.84 · « émergent » 26.56
          tl.fromTo("#s5-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, 0);
          tl.fromTo("#s5-tkw", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.5)" }, at(22.85));
          tl.fromTo("#s5-tkw", { x: 0 }, { x: 8, duration: 0.05, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, at(23.3));
          tl.fromTo("#s5-l1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, at(24.25));
          tl.fromTo("#s5-cl", { attr: { "stroke-dashoffset": 900 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.0, ease: "power2.inOut" }, at(24.3));

            tl.fromTo(o, { y: 300, scale: 0 }, { y: 0, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, at(t));
          });
          PX.burst(tl, "#s5-cam", 512, 1185, at(26.55), { n: 16, r: 360, seed: 58 });
          tl.to("#s5-cam", { y: -500, opacity: 0, filter: "blur(14px)", duration: 0.2, ease: "power3.in" }, at(26.9));
          window.__timelines["s5"] = tl;
        })();
