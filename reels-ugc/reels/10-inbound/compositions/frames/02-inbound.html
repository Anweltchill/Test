<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s2-cam { position: absolute; inset: 0; }
        #s2-l1 { position: absolute; left: 64px; right: 120px; top: 290px; text-align: center; font-size: 40px; display: block; }
        #s2-l2 { position: absolute; left: 64px; right: 120px; top: 340px; text-align: center; font-size: 150px; display: block; white-space: nowrap; }
        .s2-n { position: absolute; left: 112px; width: 800px; height: 150px; display: flex; align-items: center; gap: 24px; padding: 0 30px; }
        #s2-n1 { top: 600px; }
        #s2-n2 { top: 780px; }
        #s2-n3 { top: 960px; }
        .s2-av { width: 100px; height: 100px; flex: none; border-radius: 50%; background: #F0E6DD; display: flex; align-items: center; justify-content: center; }
        .s2-avi { width: 70px; height: 70px; }
        .s2-tx { flex: 1; display: block; }
        .s2-who { font: 600 36px "PxSans", sans-serif; display: block; }
        .s2-what { font: 400 30px "PxSans", sans-serif; color: #5E5A57; display: block; }
        .s2-ig { width: 60px; height: 60px; flex: none; }
        #s2-bellw { position: absolute; left: 800px; top: 1130px; width: 140px; height: 140px; display: block; }
        #s2-bell { width: 140px; height: 140px; }
      </style>
      <div id="root" data-composition-id="s2" data-width="1080" data-height="1920">
        <div id="s2-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s2-l1" class="t-label">Ça s'appelle</span>
          <span id="s2-l2" class="t-serif t-italic acc">l'inbound</span>
          <div id="s2-n1" class="s2-n card"><span class="s2-av"><img class="s2-avi img3d" src="assets/lib/emoji/shopping-bags.png" alt="" /></span><span class="s2-tx"><span class="s2-who">Brand X</span><span class="s2-what">t'a envoyé un message</span></span><img class="s2-ig" src="assets/lib/logos/instagram-icon.svg" alt="" /></div>
          <div id="s2-n2" class="s2-n card"><span class="s2-av"><img class="s2-avi img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /></span><span class="s2-tx"><span class="s2-who">Brand Y</span><span class="s2-what">aimerait collaborer avec toi</span></span><img class="s2-ig" src="assets/lib/logos/tiktok-icon.svg" alt="" /></div>
          <div id="s2-n3" class="s2-n card"><span class="s2-av"><img class="s2-avi img3d" src="assets/lib/emoji/lipstick.png" alt="" /></span><span class="s2-tx"><span class="s2-who">Brand Z</span><span class="s2-what">t'a envoyé un e-mail</span></span><img class="s2-ig" src="assets/lib/logos/gmail.svg" alt="" /></div>
          <div id="s2-bellw"><img id="s2-bell" class="img3d" src="assets/lib/emoji/bell.png" alt="" /></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 4.0, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « l'inbound » 4.48 · « marque te repère » 5.60–6.00 · « réseaux » 6.64 · « contacte directement » 7.28–7.84
          tl.fromTo("#s2-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, 0);
          tl.fromTo("#s2-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3 }, at(4.05));
          PX.letters(tl, "#s2-l2", at(4.4), { y: 120, stagger: 0.035, dur: 0.45 });
          [["#s2-n1", 5.6], ["#s2-n2", 6.6], ["#s2-n3", 7.3]].forEach(([n, t]) => {
            tl.fromTo(n, { y: -400, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, at(t));
            tl.fromTo(n + " .s2-avi", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, at(t + 0.15));
          });
          tl.fromTo("#s2-bell", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(5.7));
          tl.fromTo("#s2-bellw", { rotation: -18 }, { rotation: 18, duration: 0.08, yoyo: true, repeat: 23, ease: "sine.inOut", immediateRender: false }, at(5.9));
          PX.burst(tl, "#s2-cam", 870, 1200, at(7.85), { n: 12, r: 200, size: 14, seed: 23 });
          tl.to("#s2-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(8.36));
          window.__timelines["s2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
