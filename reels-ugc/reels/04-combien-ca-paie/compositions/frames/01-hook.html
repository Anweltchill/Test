<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s1-cam { position: absolute; inset: 0; }
        #s1-q { position: absolute; left: 64px; right: 120px; top: 270px; text-align: center; font-size: 150px; display: block; white-space: nowrap; }
        #s1-slot { position: absolute; left: 172px; top: 520px; width: 680px; height: 300px; display: flex; align-items: center; justify-content: center; gap: 18px; }
        .s1-col { width: 130px; height: 200px; border-radius: 22px; background: #0E1928; overflow: hidden; position: relative; display: block; }
        .s1-strip { position: absolute; left: 0; right: 0; top: 0; display: block; }
        .s1-d { height: 200px; display: flex; align-items: center; justify-content: center; font: 700 130px "PxSerif", serif; color: #FDF4ED; }
        .s1-eur { font: 700 140px "PxSerif", serif; color: #E2718D; display: block; margin-left: 10px; }
        #s1-moneyw { position: absolute; left: 720px; top: 380px; width: 230px; height: 230px; display: block; }
        #s1-money { width: 230px; height: 230px; }
        #s1-ugc { position: absolute; left: 0; right: 56px; top: 900px; text-align: center; display: block; }
        #s1-pill { display: inline-flex; align-items: center; gap: 18px; background: #FDF4ED; border-radius: 999px; padding: 14px 40px 14px 18px; font: 600 54px "PxSans", sans-serif; box-shadow: 0 12px 30px rgba(14,25,40,0.12); }
        #s1-ph { width: 90px; height: 90px; }
        #s1-think { position: absolute; left: 90px; top: 960px; width: 170px; height: 170px; }
      </style>
      <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div id="s1-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s1-q" class="t-serif">Combien <span class="acc">?</span></div>
          <div id="s1-slot" class="card">
            <div class="s1-col"><div class="s1-strip" id="s1-st1"></div></div>
            <div class="s1-col"><div class="s1-strip" id="s1-st2"></div></div>
            <div class="s1-col"><div class="s1-strip" id="s1-st3"></div></div>
            <span class="s1-eur">€</span>
          </div>
          <div id="s1-moneyw"><img id="s1-money" class="img3d" src="assets/lib/emoji/money-with-wings.png" alt="" /></div>
          <div id="s1-ugc"><span id="s1-pill"><img id="s1-ph" src="assets/lib/emoji/mobile-phone.png" alt="" />pour une vidéo UGC</span></div>
          <img id="s1-think" class="img3d" src="assets/lib/emoji/thinking-face.png" alt="" />
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // « Combien » 0.00 · « facturer » 0.56 · « vidéo UGC » 1.04–1.36 · « ? » 1.92
          // rouleaux de machine à sous : chiffres déterministes, s'arrêtent sur « ? »
          const R = PX.rng(12);
          ["#s1-st1", "#s1-st2", "#s1-st3"].forEach((id, k) => {
            const strip = document.querySelector(id);
            for (let i = 0; i < 14; i++) { const d = document.createElement("div"); d.className = "s1-d"; d.textContent = i === 13 ? "?" : String(Math.floor(R() * 10)); strip.appendChild(d); }
            tl.fromTo(strip, { y: 0 }, { y: -200 * 13, duration: 1.3 + k * 0.25, ease: "power3.out" }, 0.25);
          });
          tl.fromTo("#s1-q", { scale: 1.6, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0);
          tl.fromTo("#s1-slot", { y: 200, opacity: 0, rotationX: -40 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.45, ease: "expo.out", transformPerspective: 1200 }, 0.1);
          tl.fromTo("#s1-money", { scale: 0, rotation: -40, x: -200 }, { scale: 1, rotation: 0, x: 0, duration: 0.55, ease: "back.out(2)" }, 0.45);
          PX.float(tl, "#s1-moneyw", 1.0, 1.4, 14, 0.9, 10);
          tl.fromTo("#s1-ugc", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 1.0);
          tl.fromTo("#s1-think", { scale: 0, rotation: 30 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, 1.6);
          tl.fromTo("#s1-slot", { x: 0 }, { x: 12, duration: 0.05, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, 1.85);
          PX.burst(tl, "#s1-cam", 512, 670, 1.85, { n: 14, r: 330, seed: 13 });
          tl.to("#s1-cam", { x: -1080, filter: "blur(16px)", duration: 0.24, ease: "power3.in" }, 2.16);
          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
