      <script>
        (function () {
          const T0 = 29.8, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « méthode complète » 30.43–30.75 · « prix » 31.63 · « Écris » 32.03 · « tarif » 32.59 · « message privé » 33.23–33.55
          tl.fromTo("#s6-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 0);
          tl.fromTo("#s6-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4 }, at(30.1));
          PX.letters(tl, "#s6-l2", at(30.9), { y: 80, stagger: 0.025, dur: 0.4 }).slice(15, 19).forEach((c) => (c.style.color = "#E2718D"));
          tl.fromTo("#s6-bag", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, at(31.5));
          PX.float(tl, "#s6-bagw", at(32.0), 3.5, 10, 1.1, 8);
          tl.fromTo("#s6-dm", { y: 200, opacity: 0, rotationX: -25 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.5, ease: "expo.out", transformPerspective: 1400 }, at(30.3));
          const txt = document.querySelector("#s6-txt"), ph = document.querySelector("#s6-ph"), W = "TARIFS";
          const ty = { _v: 0, get v() { return this._v; }, set v(x) { this._v = x; const n = Math.round(x); txt.textContent = W.slice(0, n); ph.style.display = n > 0 ? "none" : "block"; } };

          tl.fromTo("#s6-send", { scale: 1 }, { scale: 0.82, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.in", immediateRender: false }, at(32.75));
          tl.to(ty, { v: 0, duration: 0.01 }, at(32.9));

          PX.burst(tl, "#s6-cam", 760, 720, at(33.2), { n: 12, r: 170, size: 16, seed: 63 });
          tl.fromTo("#s6-rep", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, at(33.6));
          tl.fromTo("#s6-cta", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, at(33.3));
          tl.fromTo("#s6-env", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, at(33.5));
          PX.pulse(tl, "#s6-btn", at(33.9), 1.6, 1.06, 0.75);
          window.__timelines["s6"] = tl;
        })();
