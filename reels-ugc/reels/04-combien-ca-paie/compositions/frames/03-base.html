<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s3-cam { position: absolute; inset: 0; }
        #s3-l1 { position: absolute; left: 64px; right: 120px; top: 360px; text-align: center; font-size: 60px; display: block; }
        #s3-l2 { position: absolute; left: 64px; right: 120px; top: 450px; text-align: center; font-size: 150px; display: block; white-space: nowrap; }
        #s3-stack { position: absolute; left: 312px; top: 680px; width: 400px; height: 560px; display: block; }
        .s3-b { position: absolute; left: 0; width: 400px; height: 120px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font: 600 44px "PxSans", sans-serif; letter-spacing: 0.08em; }
        #s3-b0 { top: 440px; background: #0E1928; color: #FDF4ED; }
        #s3-b1 { top: 300px; background: #E6BDC1; color: #0E1928; }
        #s3-b2 { top: 160px; background: #DB96A1; color: #0E1928; }
        #s3-b3 { top: 20px; background: #E2718D; color: #FDF4ED; }
        #s3-rocketw { position: absolute; left: 720px; top: 640px; width: 200px; height: 200px; display: block; }
        #s3-rocket { width: 200px; height: 200px; }
      </style>
      <div id="root" data-composition-id="s3" data-width="1080" data-height="1920">
        <div id="s3-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s3-l1" class="t-italic">Et ça, c'est seulement</div>
          <div id="s3-l2" class="t-serif">la <span class="acc">base</span></div>
          <div id="s3-stack">
            <div id="s3-b3" class="s3-b">???</div>
            <div id="s3-b2" class="s3-b">???</div>
            <div id="s3-b1" class="s3-b">???</div>
            <div id="s3-b0" class="s3-b">BASE</div>
          </div>
          <div id="s3-rocketw"><img id="s3-rocket" class="img3d" src="assets/lib/emoji/rocket.png" alt="" /></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 10.3, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « Et ça » 10.48 · « seulement » 11.28 · « base » 11.84
          tl.fromTo("#s3-cam", { scale: 0.6, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0);
          tl.fromTo("#s3-l1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4 }, at(10.4));
          tl.fromTo("#s3-b0", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, at(10.5));
          PX.letters(tl, "#s3-l2", at(11.6), { y: 100, stagger: 0.04, dur: 0.4 }).slice(3).forEach((c) => (c.style.color = "#E2718D"));
          ["#s3-b1", "#s3-b2", "#s3-b3"].forEach((b, i) => tl.fromTo(b, { y: -700, opacity: 0, rotation: i % 2 ? 6 : -6 }, { y: 0, opacity: 1, rotation: 0, duration: 0.4, ease: "bounce.out" }, at(10.9 + i * 0.28)));
          tl.fromTo("#s3-rocket", { scale: 0, y: 200, rotation: -20 }, { scale: 1, y: 0, rotation: 0, duration: 0.5, ease: "back.out(2)" }, at(11.5));
          tl.to("#s3-rocketw", { y: -500, x: 120, duration: 0.5, ease: "power3.in" }, at(11.95));
          tl.to("#s3-cam", { x: -1080, filter: "blur(16px)", duration: 0.22, ease: "power3.in" }, at(12.1));
          window.__timelines["s3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
