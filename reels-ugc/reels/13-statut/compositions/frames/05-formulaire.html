<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s5-cam { position: absolute; inset: 0; }
        #s5-form { position: absolute; left: 112px; top: 280px; width: 800px; height: 780px; display: block; overflow: hidden; }
        #s5-top { position: absolute; left: 0; right: 0; top: 0; height: 80px; background: #F0E6DD; display: flex; align-items: center; gap: 14px; padding: 0 30px; }
        .s5-d { width: 20px; height: 20px; border-radius: 50%; background: #DB96A1; display: block; }
        #s5-url { margin-left: 16px; height: 44px; border-radius: 22px; background: #FDF4ED; display: flex; align-items: center; padding: 0 24px; font: 500 26px "PxSans", sans-serif; color: #5E5A57; }
        #s5-lap { position: absolute; right: 30px; top: 100px; width: 110px; height: 110px; }
        #s5-ttl { position: absolute; left: 36px; top: 115px; font-size: 52px; display: block; }
        #s5-sub { position: absolute; left: 36px; top: 185px; font-size: 26px; display: block; }
        #s5-steps { position: absolute; left: 36px; right: 36px; top: 250px; height: 14px; border-radius: 7px; background: #F0E6DD; overflow: hidden; display: block; }
        #s5-fill { width: 100%; height: 100%; background: #E2718D; display: block; transform-origin: 0% 50%; }
        .s5-f { position: absolute; left: 36px; right: 36px; height: 96px; border-radius: 20px; border: 3px solid #E6BDC1; display: flex; align-items: center; gap: 20px; padding: 0 24px; }
        .s5-n { width: 54px; height: 54px; flex: none; border-radius: 50%; background: #0E1928; color: #FDF4ED; font: 600 28px "PxSans", sans-serif; display: flex; align-items: center; justify-content: center; }
        .s5-bl { height: 20px; border-radius: 10px; background: #C2C7DD; display: block; }
        .s5-ck { width: 60px; height: 60px; margin-left: auto; flex: none; }
        #s5-ok { position: absolute; left: 0; right: 56px; top: 1110px; text-align: center; display: block; }
        #s5-okb { display: inline-flex; align-items: center; gap: 16px; background: #0E1928; color: #FDF4ED; border-radius: 999px; padding: 12px 40px 12px 16px; font-size: 44px; white-space: nowrap; }
        #s5-th { width: 84px; height: 84px; }
      </style>
      <div id="root" data-composition-id="s5" data-width="1080" data-height="1920">
        <div id="s5-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s5-form" class="card">
            <div id="s5-top"><span class="s5-d"></span><span class="s5-d"></span><span class="s5-d"></span><span id="s5-url">Guichet unique</span></div>
            <img id="s5-lap" class="img3d" src="assets/lib/emoji/laptop.png" alt="" />
            <span id="s5-ttl" class="t-serif">Déclaration <span class="acc">en ligne</span></span>
            <span id="s5-sub" class="t-label">En quelques étapes</span>
            <div id="s5-steps"><div id="s5-fill"></div></div>
          </div>
          <div id="s5-ok"><span id="s5-okb" class="t-serif"><img id="s5-th" class="img3d" src="assets/lib/emoji/thumbs-up.png" alt="" />Pas besoin d'être <span style="color:#E6BDC1">experte</span></span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 14.56, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « déclaration » 14.72 · « en ligne » 15.68–15.76 · « guichet unique » 16.32–16.88 · « étapes » 17.76 · « experte » 19.04 · « administratif » 19.60
          tl.fromTo("#s5-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s5-form", { y: 400, opacity: 0, rotationX: -25 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.5, ease: "expo.out", transformPerspective: 1400 }, at(14.6));
          tl.fromTo("#s5-lap", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, at(15.6));
          tl.fromTo("#s5-url", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "back.out(2)" }, at(16.25));
          tl.fromTo("#s5-sub", { opacity: 0 }, { opacity: 1, duration: 0.3 }, at(17.3));
          const F = document.querySelector("#s5-form"), W = [380, 300, 420, 340];
          W.forEach((w, i) => {
            const f = document.createElement("div"); f.className = "s5-f"; f.style.top = 300 + i * 116 + "px";
            f.innerHTML = '<span class="s5-n">' + (i + 1) + '</span><span class="s5-bl" style="width:' + w + 'px"></span><img class="s5-ck" src="assets/lib/emoji/check-mark-button.png" alt="" />';
            F.appendChild(f);
            const t = 17.3 + i * 0.32;
            tl.fromTo(f, { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, at(t));
            tl.fromTo(f.querySelector(".s5-ck"), { scale: 0, rotation: 90 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(3)" }, at(t + 0.22));
            tl.fromTo("#s5-fill", { scaleX: i * 0.25 }, { scaleX: (i + 1) * 0.25, duration: 0.25, ease: "power2.out", immediateRender: i === 0 }, at(t + 0.22));
          });
          tl.fromTo("#s5-ok", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, at(18.9));
          tl.fromTo("#s5-th", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, at(19.05));
          PX.burst(tl, "#s5-cam", 512, 1160, at(19.6), { n: 14, r: 320, seed: 51 });
          tl.to("#s5-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(20.2));
          window.__timelines["s5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
