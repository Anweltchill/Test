<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s6-cam { position: absolute; inset: 0; }
        #s6-dark { position: absolute; left: 50px; right: 50px; top: 240px; height: 1090px; border-radius: 48px; background: #0E1928; opacity: 0; display: block; }
        #s6-l1 { position: absolute; left: 64px; right: 120px; top: 300px; text-align: center; font-size: 40px; color: #E6BDC1; display: block; }
        #s6-l2 { position: absolute; left: 64px; right: 120px; top: 360px; text-align: center; font-size: 96px; color: #FDF4ED; display: block; white-space: nowrap; }
        .s6-r { position: absolute; left: 132px; width: 760px; height: 110px; border-radius: 26px; background: #172742; display: flex; align-items: center; gap: 24px; padding: 0 28px; }
        .s6-box { position: relative; width: 60px; height: 60px; flex: none; border-radius: 12px; border: 5px solid #8F9AC3; display: block; }
        .s6-bl { height: 20px; border-radius: 10px; background: #8F9AC3; filter: blur(5px); display: block; }
        #s6-hot { position: absolute; inset: -5px; border-radius: 12px; border: 6px solid #E2718D; background: rgba(226, 113, 141, 0.3); opacity: 0; display: block; }
        #s6-warn { position: absolute; left: 790px; top: 0; width: 90px; height: 90px; opacity: 0; }
        #s6-tag { position: absolute; left: 0; right: 56px; top: 1170px; text-align: center; display: block; opacity: 0; }
        #s6-tagb { display: inline-block; background: #E2718D; color: #FDF4ED; border-radius: 999px; padding: 12px 40px; font: 600 40px "PxSans", sans-serif; letter-spacing: 0.1em; }
      </style>
      <div id="root" data-composition-id="s6" data-width="1080" data-height="1920">
        <div id="s6-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s6-dark"></div>
          <span id="s6-l1" class="t-label">Par contre…</span>
          <span id="s6-l2" class="t-serif">certaines <span class="acc">cases</span></span>
          <div id="s6-tag"><span id="s6-tagb">ATTENTION</span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 20.43, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // chuchoté : « Par contre » 20.43–20.75 · « cases » 21.55 · « tromper » 22.67
          tl.fromTo("#s6-dark", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0);
          tl.fromTo("#s6-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35 }, at(20.5));
          tl.fromTo("#s6-l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at(21.4));
          const cam = document.querySelector("#s6-cam"), W = [440, 360, 480, 320];
          W.forEach((w, i) => {
            const r = document.createElement("div"); r.className = "s6-r"; r.style.top = 540 + i * 140 + "px";
            r.innerHTML = '<span class="s6-box">' + (i === 2 ? '<span id="s6-hot"></span>' : "") + '</span><span class="s6-bl" style="width:' + w + 'px"></span>';
            cam.appendChild(r);
            tl.fromTo(r, { x: i % 2 ? 900 : -900, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, at(20.7 + i * 0.12));
          });
          // une case clignote en rose
          tl.fromTo("#s6-hot", { opacity: 0 }, { opacity: 1, duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut" }, at(21.7));
          tl.fromTo("#s6-tag", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, at(22.5));
          tl.to("#s6-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(23.1));
          window.__timelines["s6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
