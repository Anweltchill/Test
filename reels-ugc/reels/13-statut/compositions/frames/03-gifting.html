<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s3-cam { position: absolute; inset: 0; }
        #s3-l1 { position: absolute; left: 64px; right: 120px; top: 290px; text-align: center; font-size: 40px; display: block; }
        #s3-l2 { position: absolute; left: 64px; right: 120px; top: 350px; text-align: center; font-size: 110px; display: block; white-space: nowrap; }
        #s3-gw { position: absolute; left: 392px; top: 540px; width: 240px; height: 240px; display: block; }
        #s3-g { width: 240px; height: 240px; }
        #s3-time { position: absolute; left: 112px; top: 880px; width: 800px; height: 280px; display: flex; align-items: center; gap: 30px; padding: 0 40px; }
        #s3-cal { width: 150px; height: 150px; flex: none; }
        #s3-tt { display: block; flex: 1; }
        #s3-tl { font-size: 54px; line-height: 1.1; display: block; }
        #s3-bar { margin-top: 18px; height: 22px; border-radius: 11px; background: #F0E6DD; overflow: hidden; display: block; }
        #s3-fill { width: 100%; height: 100%; background: #E2718D; display: block; }
      </style>
      <div id="root" data-composition-id="s3" data-width="1080" data-height="1920">
        <div id="s3-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s3-l1" class="t-label">Tu commences par du</span>
          <span id="s3-l2" class="t-serif acc">gifting</span>
          <div id="s3-gw"><img id="s3-g" class="img3d" src="assets/lib/emoji/wrapped-gift.png" alt="" /></div>
          <div id="s3-time" class="card"><img id="s3-cal" class="img3d" src="assets/lib/emoji/spiral-calendar.png" alt="" /><span id="s3-tt"><span id="s3-tl" class="t-serif">Du temps pour <span class="acc">préparer la suite</span></span><span id="s3-bar"><span id="s3-fill"></span></span></span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 4.88, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « gifting » 5.92 · « gagnes du temps » 6.72–7.12 · « préparer la suite » 7.44–8.00
          tl.fromTo("#s3-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s3-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3 }, at(4.95));
          PX.letters(tl, "#s3-l2", at(5.85), { y: 100, stagger: 0.035, dur: 0.4 });
          tl.fromTo("#s3-g", { y: -700, rotation: -20 }, { y: 0, rotation: 0, duration: 0.55, ease: "bounce.out" }, at(5.5));
          PX.burst(tl, "#s3-cam", 512, 660, at(6.05), { n: 14, r: 280, seed: 13 });
          PX.float(tl, "#s3-gw", at(6.2), 2.0, 8, 1.0, 4);
          tl.fromTo("#s3-time", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, at(6.6));
          tl.fromTo("#s3-cal", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, at(6.75));
          tl.fromTo("#s3-fill", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 1.2, ease: "power1.inOut" }, at(7.0));
          tl.to("#s3-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(8.28));
          window.__timelines["s3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
