<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s2-cam { position: absolute; inset: 0; }
        #s2-t1 { position: absolute; left: 64px; right: 120px; top: 520px; text-align: center; font-size: 114px; display: block; white-space: nowrap; }
        #s2-t2 { position: absolute; left: 64px; right: 120px; top: 700px; text-align: center; font-size: 70px; display: block; white-space: nowrap; }
        #s2-hgw { position: absolute; left: 432px; top: 880px; width: 160px; height: 160px; display: block; }
        #s2-hg { width: 160px; height: 160px; }
      </style>
      <div id="root" data-composition-id="s2" data-width="1080" data-height="1920">
        <div id="s2-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s2-t1" class="t-serif">Pas <span class="acc">forcément</span></span>
          <span id="s2-t2" class="t-serif t-italic">tout de suite</span>
          <div id="s2-hgw"><img id="s2-hg" class="img3d" src="assets/lib/emoji/hourglass-not-done.png" alt="" /></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 3.5, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « Pas forcément » 3.52–3.76 · « tout de suite » 4.24–4.48
          tl.fromTo("#s2-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 0);
          PX.letters(tl, "#s2-t1", at(3.55), { y: 100, stagger: 0.03, dur: 0.35 });
          tl.fromTo("#s2-t2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at(4.2));
          tl.fromTo("#s2-hg", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(4.0));
          tl.fromTo("#s2-hgw", { rotation: 0 }, { rotation: 180, duration: 0.4, ease: "power2.inOut" }, at(4.35));
          tl.to("#s2-cam", { x: -1080, filter: "blur(16px)", duration: 0.18, ease: "power3.in" }, at(4.7));
          window.__timelines["s2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
