      <script>
        (function () {

          tl.fromTo("#s1-ap", { attr: { "stroke-dashoffset": 200 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.4, ease: "power2.out" }, 1.5);
          tl.fromTo("#s1-cb", { x: 600, rotation: 8 }, { x: 0, rotation: 0, duration: 0.45, ease: "back.out(1.5)" }, 1.95);
