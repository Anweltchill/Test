<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s3-cam { position: absolute; inset: 0; }
        #s3-box { position: absolute; left: 112px; top: 290px; width: 800px; height: 900px; display: block; overflow: hidden; }
        #s3-head { position: absolute; left: 0; right: 0; top: 0; height: 130px; border-bottom: 2px solid #E6BDC1; display: flex; align-items: center; gap: 20px; padding: 0 30px; }
        #s3-bi { width: 84px; height: 84px; flex: none; }
        #s3-ht { flex: 1; display: block; }
        #s3-hl { font-size: 24px; display: block; }
        #s3-hn { font-size: 44px; display: block; }
        #s3-cnt { background: #E2718D; color: #FDF4ED; border-radius: 999px; padding: 8px 24px; font: 600 40px "PxSans", sans-serif; display: block; flex: none; }
        .s3-r { position: absolute; left: 24px; right: 24px; height: 150px; border-radius: 26px; background: #F0E6DD; display: flex; align-items: center; gap: 22px; padding: 0 24px; }
        #s3-r1 { top: 160px; }
        #s3-r2 { top: 330px; }
        #s3-r3 { top: 500px; }
        #s3-r4 { top: 670px; }
        .s3-av { width: 90px; height: 90px; flex: none; border-radius: 50%; background: #E6BDC1; display: flex; align-items: center; justify-content: center; }
        .s3-avi { width: 64px; height: 64px; }
        .s3-tx { font: 500 38px "PxSans", sans-serif; display: block; flex: 1; white-space: nowrap; overflow: hidden; }
        .s3-je { display: inline-block; background: #E2718D; color: #FDF4ED; border-radius: 10px; padding: 0 10px; }
        .s3-z { width: 70px; height: 70px; flex: none; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s3" data-width="1080" data-height="1920">
        <div id="s3-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s3-box" class="card">
            <div id="s3-head"><img id="s3-bi" class="img3d" src="assets/lib/emoji/shopping-bags.png" alt="" /><div id="s3-ht"><span id="s3-hl" class="t-label">Boîte de réception</span><span id="s3-hn" class="t-serif">Brand X</span></div><span id="s3-cnt">0</span></div>
            <div id="s3-r1" class="s3-r"><span class="s3-av"><img class="s3-avi" src="assets/lib/emoji/bust-in-silhouette.png" alt="" /></span><span class="s3-tx"><span class="s3-je">Je</span> suis créatrice UGC…</span><img class="s3-z" src="assets/lib/emoji/cross-mark.png" alt="" /></div>
            <div id="s3-r2" class="s3-r"><span class="s3-av"><img class="s3-avi" src="assets/lib/emoji/bust-in-silhouette.png" alt="" /></span><span class="s3-tx"><span class="s3-je">Moi</span>, je fais des vidéos…</span><img class="s3-z" src="assets/lib/emoji/cross-mark.png" alt="" /></div>
            <div id="s3-r3" class="s3-r"><span class="s3-av"><img class="s3-avi" src="assets/lib/emoji/bust-in-silhouette.png" alt="" /></span><span class="s3-tx"><span class="s3-je">Je</span> cherche des collabs…</span><img class="s3-z" src="assets/lib/emoji/cross-mark.png" alt="" /></div>
            <div id="s3-r4" class="s3-r"><span class="s3-av"><img class="s3-avi" src="assets/lib/emoji/bust-in-silhouette.png" alt="" /></span><span class="s3-tx"><span class="s3-je">Je</span> suis dispo pour…</span><img class="s3-z" src="assets/lib/emoji/cross-mark.png" alt="" /></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 5.49, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « marque reçoit » 5.73–6.05 · « dizaines » 6.61 · « créatrice » 8.85 · « ignorées » 9.81
          tl.fromTo("#s3-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, 0);
          tl.fromTo("#s3-bi", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, at(5.7));
          const n = document.querySelector("#s3-cnt");
          const c = { _v: 0, get v() { return this._v; }, set v(x) { this._v = x; n.textContent = Math.round(x) + " demandes"; } };
          tl.fromTo(c, { v: 0 }, { v: 48, duration: 1.4, ease: "power2.out" }, at(6.1));
          tl.fromTo("#s3-cnt", { scale: 1 }, { scale: 1.15, duration: 0.12, yoyo: true, repeat: 3, ease: "power2.out", immediateRender: false }, at(6.6));
          ["#s3-r1", "#s3-r2", "#s3-r3", "#s3-r4"].forEach((r, i) => tl.fromTo(r, { y: -200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, at(6.3 + i * 0.18)));
          // « ne parlent que de la créatrice » : les « je » s'allument
          tl.fromTo(".s3-je", { scale: 1 }, { scale: 1.3, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", stagger: 0.12, immediateRender: false }, at(8.2));
          // « ignorées » : tout se ternit
          tl.to(".s3-r", { opacity: 0.35, filter: "grayscale(1)", duration: 0.4, stagger: 0.06 }, at(9.75));
          tl.fromTo(".s3-z", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.08 }, at(9.8));
          tl.to("#s3-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(10.27));
          window.__timelines["s3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
