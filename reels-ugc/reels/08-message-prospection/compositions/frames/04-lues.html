<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s4-cam { position: absolute; inset: 0; }
        #s4-l1 { position: absolute; left: 64px; right: 120px; top: 290px; text-align: center; font-size: 40px; display: block; }
        #s4-l2 { position: absolute; left: 64px; right: 120px; top: 350px; text-align: center; font-size: 100px; display: block; white-space: nowrap; }
        #s4-msg { position: absolute; left: 112px; top: 560px; width: 800px; height: 330px; display: block; }
        #s4-ex { position: absolute; left: 36px; top: 30px; font-size: 24px; color: #CC7183; display: block; }
        #s4-tx { position: absolute; left: 36px; right: 36px; top: 80px; font: 500 46px/1.3 "PxSans", sans-serif; display: block; }
        #s4-tx b { color: #E2718D; }
        #s4-lu { position: absolute; right: 36px; bottom: 22px; display: flex; align-items: center; gap: 10px; font: 600 32px "PxSans", sans-serif; color: #E2718D; }
        #s4-ck { width: 44px; height: 44px; }
        #s4-eyesw { position: absolute; left: 252px; top: 960px; width: 200px; height: 200px; display: block; }
        #s4-eyes { width: 200px; height: 200px; }
        #s4-heartw { position: absolute; left: 572px; top: 960px; width: 200px; height: 200px; display: block; }
        #s4-heart { width: 200px; height: 200px; }
      </style>
      <div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
        <div id="s4-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s4-l1" class="t-label">Celles qui parlent de</span>
          <span id="s4-l2" class="t-serif">la <span class="acc">marque</span></span>
          <div id="s4-msg" class="card">
            <span id="s4-ex" class="t-label">Exemple</span>
            <span id="s4-tx"><b>Votre</b> nouvelle gamme m'a donné une idée de vidéo pour <b>vous</b>…</span>
            <div id="s4-lu">Lu <img id="s4-ck" src="assets/lib/emoji/check-mark-button.png" alt="" /></div>
          </div>
          <div id="s4-eyesw"><img id="s4-eyes" class="img3d" src="assets/lib/emoji/eyes.png" alt="" /></div>
          <div id="s4-heartw"><img id="s4-heart" class="img3d" src="assets/lib/emoji/smiling-face-with-heart-eyes.png" alt="" /></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 10.45, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « parlent » 10.93 · « marque » 11.33 · « lues » 12.05
          tl.fromTo("#s4-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, 0);
          tl.fromTo("#s4-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3 }, at(10.55));
          tl.fromTo("#s4-l2", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, at(11.2));
          tl.fromTo("#s4-msg", { y: 300, opacity: 0, rotationX: -25 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.45, ease: "expo.out", transformPerspective: 1400 }, at(10.7));
          tl.fromTo("#s4-lu", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, at(12.0));
          tl.fromTo("#s4-eyes", { scale: 0, y: 80 }, { scale: 1, y: 0, duration: 0.35, ease: "back.out(3)" }, at(11.85));
          tl.fromTo("#s4-heart", { scale: 0, y: 80 }, { scale: 1, y: 0, duration: 0.35, ease: "back.out(3)" }, at(12.0));
          PX.burst(tl, "#s4-cam", 672, 1060, at(12.15), { n: 12, r: 220, size: 14, seed: 44 });
          tl.to("#s4-cam", { y: -500, opacity: 0, filter: "blur(14px)", duration: 0.2, ease: "power3.in" }, at(12.42));
          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
