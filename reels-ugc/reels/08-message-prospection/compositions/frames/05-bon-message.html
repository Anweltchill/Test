<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s5-cam { position: absolute; inset: 0; }
        #s5-l1 { position: absolute; left: 64px; right: 120px; top: 290px; text-align: center; font-size: 92px; display: block; white-space: nowrap; }
        .s5-c { position: absolute; left: 112px; width: 800px; height: 220px; display: flex; align-items: center; gap: 30px; padding: 0 36px; }
        #s5-c1 { top: 490px; }
        #s5-c2 { top: 740px; }
        #s5-c3 { top: 990px; }
        .s5-i { width: 150px; height: 150px; flex: none; }
        .s5-t { font-size: 60px; line-height: 1.1; display: block; flex: 1; }
        .s5-ok { width: 80px; height: 80px; flex: none; }
      </style>
      <div id="root" data-composition-id="s5" data-width="1080" data-height="1920">
        <div id="s5-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s5-l1" class="t-serif">Un <span class="acc">bon</span> message</span>
          <div id="s5-c1" class="s5-c card"><img class="s5-i img3d" src="assets/lib/emoji/bullseye.png" alt="" /><span class="s5-t t-serif"><span class="acc">Personnalisé</span></span><img class="s5-ok" src="assets/lib/emoji/check-mark-button.png" alt="" /></div>
          <div id="s5-c2" class="s5-c card"><img class="s5-i img3d" src="assets/lib/emoji/pinching-hand.png" alt="" /><span class="s5-t t-serif"><span class="acc">Court</span></span><img class="s5-ok" src="assets/lib/emoji/check-mark-button.png" alt="" /></div>
          <div id="s5-c3" class="s5-c card"><img class="s5-i img3d" src="assets/lib/emoji/gem-stone.png" alt="" /><span class="s5-t t-serif">Ta <span class="acc">valeur</span>, tout de suite</span><img class="s5-ok" src="assets/lib/emoji/check-mark-button.png" alt="" /></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 12.61, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « bon message » 12.77–13.01 · « personnalisé » 14.29 · « court » 15.25 · « valeur » 16.93 · « apporter » 17.73
          tl.fromTo("#s5-cam", { y: 900, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" }, 0);
          PX.letters(tl, "#s5-l1", at(12.7), { y: 90, stagger: 0.03, dur: 0.4 });
          [["#s5-c1", 14.15], ["#s5-c2", 15.1], ["#s5-c3", 16.75]].forEach(([c, t], i) => {
            tl.fromTo(c, { x: i % 2 ? 900 : -900, rotation: i % 2 ? 4 : -4 }, { x: 0, rotation: 0, duration: 0.45, ease: "back.out(1.4)" }, at(t));
            tl.fromTo(c + " .s5-i", { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, at(t + 0.1));
            tl.fromTo(c + " .s5-ok", { scale: 0, rotation: 90 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(3)" }, at(t + 0.4));
          });
          tl.fromTo("#s5-c1 .s5-i", { scale: 1 }, { scale: 1.2, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at(14.7));
          tl.fromTo("#s5-c2 .s5-i", { scaleX: 1 }, { scaleX: 0.7, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.inOut", immediateRender: false }, at(15.6));
          tl.fromTo("#s5-c3 .s5-i", { rotation: 0 }, { rotation: 360, duration: 0.7, ease: "power2.inOut", immediateRender: false }, at(17.4));
          PX.burst(tl, "#s5-cam", 223, 1100, at(17.7), { n: 14, r: 240, seed: 53 });
          tl.to("#s5-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(18.18));
          window.__timelines["s5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
