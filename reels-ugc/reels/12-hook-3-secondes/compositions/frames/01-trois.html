<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s1-cam { position: absolute; inset: 0; }
        #s1-n { position: absolute; left: 64px; right: 120px; top: 250px; text-align: center; font-size: 330px; line-height: 1; color: #E2718D; display: block; }
        #s1-s { position: absolute; left: 64px; right: 120px; top: 600px; text-align: center; font-size: 34px; display: block; white-space: nowrap; }
        #s1-ph { position: absolute; left: 332px; top: 680px; width: 360px; height: 620px; border-radius: 50px; background: #0E1928; padding: 14px; display: block; }
        #s1-scr { position: relative; width: 100%; height: 100%; border-radius: 38px; background: #F0E6DD; overflow: hidden; display: block; }
        #s1-feed { position: absolute; left: 0; right: 0; top: 0; display: block; }
        .s1-post { position: absolute; left: 14px; right: 14px; height: 280px; border-radius: 22px; display: flex; align-items: center; justify-content: center; }
        .s1-pi { width: 120px; height: 120px; }
        #s1-stop { position: absolute; left: 30px; right: 30px; top: 220px; text-align: center; background: #E2718D; color: #FDF4ED; border-radius: 20px; padding: 14px 0; font: 600 40px "PxSans", sans-serif; letter-spacing: 0.1em; display: block; opacity: 0; }
        #s1-thw { position: absolute; left: 600px; top: 1060px; width: 160px; height: 160px; display: block; }
        #s1-th { width: 160px; height: 160px; }
      </style>
      <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div id="s1-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s1-n" class="t-serif">3</span>
          <span id="s1-s" class="t-label">secondes pour arrêter le scroll</span>
          <div id="s1-ph"><div id="s1-scr"><div id="s1-feed"></div><span id="s1-stop">STOP</span></div></div>
          <div id="s1-thw"><img id="s1-th" class="img3d" src="assets/lib/emoji/backhand-index-pointing-up.png" alt="" /></div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // « Trois » 0.15 · « secondes » 0.41 · « arrête » 2.17 · « scroller » 2.57
          const n = document.querySelector("#s1-n");
          const c = { _v: 3, get v() { return this._v; }, set v(x) { this._v = x; n.textContent = String(Math.max(1, Math.ceil(x))); } };
          tl.fromTo("#s1-n", { scale: 2.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.in" }, 0.1);
          tl.fromTo(c, { v: 3 }, { v: 0.01, duration: 2.0, ease: "none" }, 0.6);
          [0.6, 1.27, 1.94].forEach((t) => tl.fromTo("#s1-n", { scale: 1.25 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t));
          tl.fromTo("#s1-s", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3 }, 0.45);
          tl.fromTo("#s1-ph", { y: 700 }, { y: 0, duration: 0.45, ease: "expo.out" }, 0.3);
          // le fil défile vite sous le pouce… et s'arrête net
          const feed = document.querySelector("#s1-feed"), C = ["#E6BDC1", "#C2C7DD", "#DB96A1"], I = ["lipstick", "hot-beverage", "dress", "lotion-bottle", "sunflower", "shopping-bags", "camera-with-flash", "fishing-pole"];
          I.forEach((ic, i) => {
            const p = document.createElement("div"); p.className = "s1-post"; p.style.top = 14 + i * 296 + "px"; p.style.background = C[i % 3];
            p.innerHTML = '<img class="s1-pi img3d" src="assets/lib/emoji/' + ic + '.png" alt="" />'; feed.appendChild(p);
          });
          tl.fromTo("#s1-feed", { y: 0 }, { y: -296 * 6, duration: 1.6, ease: "power2.in" }, 0.6);
          tl.fromTo("#s1-th", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.5);
          tl.fromTo("#s1-thw", { y: 0 }, { y: -140, duration: 0.2, repeat: 5, ease: "power2.in", immediateRender: false }, 0.7);
          tl.to("#s1-thw", { y: 0, duration: 0.15 }, 1.95);
          tl.fromTo("#s1-ph", { x: 0 }, { x: 12, duration: 0.05, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, 2.2);
          tl.fromTo("#s1-stop", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.in" }, 2.15);
          tl.to("#s1-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, 2.9);
          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
