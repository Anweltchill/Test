<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s5-cam { position: absolute; inset: 0; }
        #s5-l1 { position: absolute; left: 64px; right: 120px; top: 280px; text-align: center; font-size: 40px; display: block; }
        #s5-l2 { position: absolute; left: 64px; right: 120px; top: 330px; text-align: center; font-size: 104px; display: block; white-space: nowrap; }
        #s5-vid { position: absolute; left: 342px; top: 540px; width: 340px; height: 600px; border-radius: 34px; background: #FDF4ED; box-shadow: 0 18px 44px rgba(14, 25, 40, 0.14); display: block; }
        #s5-hk { position: absolute; left: 342px; top: 540px; width: 340px; height: 170px; border-radius: 34px 34px 0 0; background: #E2718D; display: flex; align-items: center; justify-content: center; gap: 12px; color: #FDF4ED; font: 600 44px "PxSans", sans-serif; }
        #s5-hki { width: 80px; height: 80px; }
        #s5-body { position: absolute; left: 342px; top: 710px; width: 340px; height: 430px; border-radius: 0 0 34px 34px; background: #E6BDC1; display: flex; align-items: center; justify-content: center; }
        #s5-bi { width: 150px; height: 150px; }
        #s5-tag { position: absolute; left: 700px; top: 580px; width: 220px; height: 90px; border-radius: 18px; background: #0E1928; display: flex; align-items: center; justify-content: center; gap: 10px; opacity: 0; }
        #s5-tgi { width: 56px; height: 56px; }
        #s5-tgb { width: 100px; height: 22px; border-radius: 11px; background: #E6BDC1; filter: blur(5px); display: block; }
        #s5-sc { position: absolute; left: 230px; top: 660px; width: 110px; height: 110px; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s5" data-width="1080" data-height="1920">
        <div id="s5-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s5-l1" class="t-label">Donc un hook</span>
          <span id="s5-l2" class="t-serif">se vend <span class="t-italic acc">à part</span></span>
          <div id="s5-body"><img id="s5-bi" class="img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /></div>
          <div id="s5-hk"><img id="s5-hki" class="img3d" src="assets/lib/emoji/fishing-pole.png" alt="" />Hook</div>
          <img id="s5-sc" class="img3d" src="assets/lib/emoji/scissors.png" alt="" />
          <div id="s5-tag"><img id="s5-tgi" class="img3d" src="assets/lib/emoji/label.png" alt="" /><span id="s5-tgb"></span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 19.65, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « Donc un hook » 19.67–20.07 · « se vendre » 21.11–21.27 · « à part » 22.15–22.39
          tl.fromTo("#s5-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s5-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3 }, at(19.7));
          tl.fromTo(["#s5-body", "#s5-hk"], { y: 400, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, at(19.8));
          tl.fromTo("#s5-hki", { rotation: -40 }, { rotation: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }, at(20.05));
          tl.fromTo("#s5-l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, at(21.0));
          // les ciseaux séparent le hook du reste de la vidéo
          tl.fromTo("#s5-sc", { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at(21.3));
          tl.to("#s5-sc", { x: 500, rotation: -20, duration: 0.45, ease: "power2.in" }, at(21.65));
          tl.to("#s5-sc", { opacity: 0, duration: 0.1 }, at(22.1));
          tl.to("#s5-hk", { x: -150, y: -60, rotation: -8, duration: 0.4, ease: "back.out(2)" }, at(22.1));
          tl.to("#s5-body", { x: 120, y: 40, rotation: 4, opacity: 0.7, duration: 0.4, ease: "back.out(2)" }, at(22.15));
          tl.fromTo("#s5-tag", { opacity: 0, scale: 0, rotation: -20, x: -380, y: -40 }, { opacity: 1, scale: 1, rotation: -8, x: -380, y: -40, duration: 0.35, ease: "back.out(3)" }, at(22.35));
          PX.burst(tl, "#s5-cam", 360, 600, at(22.4), { n: 12, r: 200, size: 14, seed: 59 });
          tl.to("#s5-cam", { opacity: 0, scale: 0.92, filter: "blur(14px)", duration: 0.2, ease: "power2.in" }, at(22.75));
          window.__timelines["s5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
