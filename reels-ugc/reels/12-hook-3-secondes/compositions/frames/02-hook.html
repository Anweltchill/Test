<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s2-cam { position: absolute; inset: 0; }
        #s2-l1 { position: absolute; left: 64px; right: 120px; top: 290px; text-align: center; font-size: 40px; display: block; }
        #s2-l2 { position: absolute; left: 64px; right: 120px; top: 340px; text-align: center; font-size: 150px; display: block; white-space: nowrap; }
        #s2-fpw { position: absolute; left: 800px; top: 480px; width: 140px; height: 140px; display: block; }
        #s2-fp { width: 140px; height: 140px; }
        #s2-tl { position: absolute; left: 112px; top: 640px; width: 800px; height: 300px; display: block; }
        #s2-tlt { position: absolute; left: 36px; top: 30px; font-size: 26px; display: block; }
        #s2-track { position: absolute; left: 36px; right: 36px; top: 110px; height: 90px; border-radius: 20px; background: #F0E6DD; overflow: hidden; display: block; }
        #s2-hk { position: absolute; left: 0; top: 0; bottom: 0; width: 20%; background: #E2718D; display: flex; align-items: center; justify-content: center; color: #FDF4ED; font: 600 30px "PxSans", sans-serif; }
        .s2-tick { position: absolute; top: 215px; font: 500 24px "PxSans", sans-serif; color: #5E5A57; display: block; }
        #s2-eyesw { position: absolute; left: 112px; top: 990px; width: 170px; height: 170px; display: block; }
        #s2-eyes { width: 170px; height: 170px; }
        #s2-br { position: absolute; left: 320px; top: 1000px; width: 592px; height: 150px; display: flex; align-items: center; gap: 20px; padding: 0 26px; }
        #s2-bri { width: 100px; height: 100px; flex: none; }
        #s2-brt { font-size: 44px; line-height: 1.1; display: block; }
      </style>
      <div id="root" data-composition-id="s2" data-width="1080" data-height="1920">
        <div id="s2-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s2-l1" class="t-label">Ces 3 secondes, c'est</span>
          <span id="s2-l2" class="t-serif">le <span class="acc">hook</span></span>
          <div id="s2-fpw"><img id="s2-fp" class="img3d" src="assets/lib/emoji/fishing-pole.png" alt="" /></div>
          <div id="s2-tl" class="card">
            <span id="s2-tlt" class="t-label">Ta vidéo UGC</span>
            <div id="s2-track"><div id="s2-hk">0–3 s</div></div>
            <span class="s2-tick" style="left:36px">0 s</span><span class="s2-tick" style="left:180px">3 s</span><span class="s2-tick" style="right:36px">30 s</span>
          </div>
          <div id="s2-eyesw"><img id="s2-eyes" class="img3d" src="assets/lib/emoji/eyes.png" alt="" /></div>
          <div id="s2-br" class="card"><img id="s2-bri" class="img3d" src="assets/lib/emoji/shopping-bags.png" alt="" /><span id="s2-brt" class="t-serif">Ce que la marque <span class="acc">regarde en 1er</span></span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 3.1, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « 3 secondes » 3.45–3.69 · « hook » 4.49 · « UGC » 5.29 · « marques regardent » 6.41–6.65 · « premier » 7.13
          tl.fromTo("#s2-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s2-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3 }, at(3.2));
          tl.fromTo("#s2-l2", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.in" }, at(4.3));
          tl.fromTo("#s2-fp", { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.5)" }, at(4.5));
          tl.fromTo("#s2-fpw", { rotation: 0 }, { rotation: -20, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, at(4.95));
          tl.fromTo("#s2-tl", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, at(5.1));
          tl.fromTo("#s2-hk", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, at(5.5));
          tl.fromTo("#s2-hk", { opacity: 1 }, { opacity: 0.75, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, at(6.0));
          tl.fromTo("#s2-eyes", { scale: 0, y: 80 }, { scale: 1, y: 0, duration: 0.4, ease: "back.out(3)" }, at(6.3));
          tl.fromTo("#s2-br", { x: 600, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, at(6.45));
          tl.fromTo("#s2-bri", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(6.6));
          PX.burst(tl, "#s2-cam", 300, 795, at(7.1), { n: 12, r: 200, size: 14, seed: 24 });
          tl.to("#s2-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(7.4));
          window.__timelines["s2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
