<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s6-cam { position: absolute; inset: 0; }
        #s6-dark { position: absolute; left: 50px; right: 50px; top: 240px; height: 1090px; border-radius: 48px; background: #0E1928; opacity: 0; display: block; }
        #s6-earw { position: absolute; left: 392px; top: 420px; width: 240px; height: 240px; display: block; }
        #s6-ear { width: 240px; height: 240px; }
        .s6-wave { position: absolute; left: 392px; top: 420px; width: 240px; height: 240px; border-radius: 50%; border: 5px solid #E6BDC1; opacity: 0; display: block; }
        #s6-t1 { position: absolute; left: 64px; right: 120px; top: 760px; text-align: center; font-size: 110px; color: #FDF4ED; display: block; white-space: nowrap; }
        #s6-t2 { position: absolute; left: 64px; right: 120px; top: 900px; text-align: center; font-size: 66px; color: #E6BDC1; display: block; white-space: nowrap; }
      </style>
      <div id="root" data-composition-id="s6" data-width="1080" data-height="1920">
        <div id="s6-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s6-dark"></div>
          <span id="s6-w1" class="s6-wave"></span><span id="s6-w2" class="s6-wave"></span>
          <div id="s6-earw"><img id="s6-ear" class="img3d" src="assets/lib/emoji/ear.png" alt="" /></div>
          <span id="s6-t1" class="t-serif t-italic">Oui…</span>
          <span id="s6-t2" class="t-serif">tu as bien <span class="acc">entendu</span></span>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 22.95, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // chuchoté : « Oui » 23.03 · « bien entendu » 23.91–24.23
          tl.fromTo("#s6-dark", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0);
          tl.fromTo("#s6-ear", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2)" }, at(23.0));
          tl.fromTo("#s6-t1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at(23.05));
          tl.fromTo("#s6-t2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at(23.75));
          [["#s6-w1", 23.4], ["#s6-w2", 23.9]].forEach(([w, t]) => tl.fromTo(w, { scale: 1, opacity: 0.8 }, { scale: 1.8, opacity: 0, duration: 0.8, ease: "power2.out" }, at(t)));
          tl.to("#s6-cam", { x: -1080, filter: "blur(16px)", duration: 0.18, ease: "power3.in" }, at(24.72));
          window.__timelines["s6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
