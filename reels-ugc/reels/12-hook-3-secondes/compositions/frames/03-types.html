<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s3-cam { position: absolute; inset: 0; }
        #s3-l1 { position: absolute; left: 64px; right: 120px; top: 290px; text-align: center; font-size: 96px; display: block; white-space: nowrap; }
        .s3-c { position: absolute; left: 112px; width: 800px; height: 240px; display: flex; align-items: center; gap: 30px; padding: 0 36px; }
        #s3-c1 { top: 470px; }
        #s3-c2 { top: 740px; }
        #s3-c3 { top: 1010px; }
        .s3-n { font-size: 70px; color: #E2718D; display: block; flex: none; width: 50px; }
        .s3-i { width: 150px; height: 150px; flex: none; }
        .s3-t { font-size: 54px; line-height: 1.1; display: block; flex: 1; }
      </style>
      <div id="root" data-composition-id="s3" data-width="1080" data-height="1920">
        <div id="s3-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s3-l1" class="t-serif">Un <span class="acc">bon</span> hook</span>
          <div id="s3-c1" class="s3-c card"><span class="s3-n t-serif">1</span><img class="s3-i img3d" src="assets/lib/emoji/exclamation-question-mark.png" alt="" /><span class="s3-t t-serif">Une question qui <span class="acc">intrigue</span></span></div>
          <div id="s3-c2" class="s3-c card"><span class="s3-n t-serif">2</span><img class="s3-i img3d" src="assets/lib/emoji/face-with-open-eyes-and-hand-over-mouth.png" alt="" /><span class="s3-t t-serif">Un problème connu <span class="acc">par cœur</span></span></div>
          <div id="s3-c3" class="s3-c card"><span class="s3-n t-serif">3</span><img class="s3-i img3d" src="assets/lib/emoji/magic-wand.png" alt="" /><span class="s3-t t-serif">Un geste <span class="acc">inattendu</span></span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 7.6, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « bon hook » 7.83–8.07 · « question » 8.87 · « intrigue » 9.35 · « problème » 10.15 · « par cœur » 11.51–11.67 · « geste inattendu » 12.31–12.63
          tl.fromTo("#s3-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          PX.letters(tl, "#s3-l1", at(7.7), { y: 90, stagger: 0.03, dur: 0.4 });
          [["#s3-c1", 8.7], ["#s3-c2", 10.0], ["#s3-c3", 12.15]].forEach(([c, t], i) => {
            tl.fromTo(c, { x: i % 2 ? 900 : -900, rotation: i % 2 ? 4 : -4 }, { x: 0, rotation: 0, duration: 0.45, ease: "back.out(1.4)" }, at(t));
            tl.fromTo(c + " .s3-i", { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, at(t + 0.1));
            tl.fromTo(c + " .s3-n", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(t + 0.2));
          });
          tl.fromTo("#s3-c1 .s3-i", { rotation: 0 }, { rotation: 20, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, at(9.3));
          tl.fromTo("#s3-c2 .s3-i", { scale: 1 }, { scale: 1.2, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at(11.55));
          tl.fromTo("#s3-c3 .s3-i", { rotation: 0 }, { rotation: 360, duration: 0.6, ease: "power2.inOut", immediateRender: false }, at(12.6));
          PX.burst(tl, "#s3-cam", 300, 1130, at(12.8), { n: 16, r: 300, seed: 35 });
          tl.to("#s3-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(13.7));
          window.__timelines["s3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
