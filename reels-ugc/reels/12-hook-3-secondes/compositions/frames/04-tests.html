<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s4-cam { position: absolute; inset: 0; }
        #s4-l1 { position: absolute; left: 64px; right: 120px; top: 280px; text-align: center; font-size: 40px; display: block; }
        #s4-l2 { position: absolute; left: 64px; right: 120px; top: 330px; text-align: center; font-size: 96px; display: block; white-space: nowrap; }
        .s4-v { position: absolute; top: 500px; width: 250px; height: 440px; border-radius: 28px; background: #FDF4ED; box-shadow: 0 18px 44px rgba(14, 25, 40, 0.14); overflow: hidden; display: block; }
        #s4-va { left: 107px; }
        #s4-vb { left: 387px; }
        #s4-vc { left: 667px; }
        .s4-h { position: absolute; left: 0; right: 0; top: 0; height: 130px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #FDF4ED; font: 600 34px "PxSans", sans-serif; }
        .s4-hi { width: 64px; height: 64px; }
        .s4-body { position: absolute; left: 0; right: 0; top: 130px; bottom: 0; background: #E6BDC1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .s4-bi { width: 120px; height: 120px; }
        .s4-bt { font: 500 24px "PxSans", sans-serif; color: #0E1928; display: block; }
        .s4-bar { position: absolute; bottom: 630px; width: 120px; border-radius: 16px 16px 0 0; display: block; transform-origin: 50% 100%; }
        #s4-ba { left: 172px; height: 110px; background: #C2C7DD; }
        #s4-bb { left: 452px; height: 230px; background: #E2718D; }
        #s4-bc { left: 732px; height: 70px; background: #C2C7DD; }
        #s4-crown { position: absolute; left: 457px; top: 1110px; width: 110px; height: 110px; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
        <div id="s4-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s4-l1" class="t-label">Le secret</span>
          <span id="s4-l2" class="t-serif">1 vidéo, <span class="acc">3 hooks</span></span>
          <div id="s4-va" class="s4-v"><div class="s4-h" style="background:#0E1928"><img class="s4-hi img3d" src="assets/lib/emoji/exclamation-question-mark.png" alt="" />A</div><div class="s4-body"><img class="s4-bi img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /><span class="s4-bt">même vidéo</span></div></div>
          <div id="s4-vb" class="s4-v"><div class="s4-h" style="background:#E2718D"><img class="s4-hi img3d" src="assets/lib/emoji/face-with-open-eyes-and-hand-over-mouth.png" alt="" />B</div><div class="s4-body"><img class="s4-bi img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /><span class="s4-bt">même vidéo</span></div></div>
          <div id="s4-vc" class="s4-v"><div class="s4-h" style="background:#172742"><img class="s4-hi img3d" src="assets/lib/emoji/magic-wand.png" alt="" />C</div><div class="s4-body"><img class="s4-bi img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /><span class="s4-bt">même vidéo</span></div></div>
          <div id="s4-ba" class="s4-bar"></div><div id="s4-bb" class="s4-bar"></div><div id="s4-bc" class="s4-bar"></div>
          <img id="s4-crown" class="img3d" src="assets/lib/emoji/trophy.png" alt="" />
        </div>
      </div>
      <script>
        (function () {
          const T0 = 13.9, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « secret » 14.55 · « testent » 15.67 · « plusieurs hooks » 16.39–16.71 · « même vidéo » 17.35–17.59 · « fonctionne le mieux » 18.79–19.27
          tl.fromTo("#s4-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s4-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3 }, at(14.4));
          tl.fromTo("#s4-l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, at(16.3));
          // la même vidéo, dupliquée…
          tl.fromTo("#s4-vb", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2)" }, at(15.5));
          tl.fromTo("#s4-va", { x: 280, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, at(16.3));
          tl.fromTo("#s4-vc", { x: -280, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, at(16.4));
          // … seuls les hooks changent
          ["#s4-va", "#s4-vb", "#s4-vc"].forEach((v, i) => tl.fromTo(v + " .s4-h", { y: -140 }, { y: 0, duration: 0.35, ease: "back.out(2)" }, at(16.6 + i * 0.12)));
          tl.fromTo(".s4-body", { opacity: 1 }, { opacity: 0.6, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, at(17.35));
          // « lequel fonctionne le mieux »
          tl.fromTo(".s4-bar", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out", stagger: 0.1 }, at(18.3));
          tl.fromTo("#s4-crown", { opacity: 0, y: -200, rotation: -20 }, { opacity: 1, y: 0, rotation: 0, duration: 0.35, ease: "bounce.out" }, at(19.1));
          tl.fromTo("#s4-vb", { scale: 1 }, { scale: 1.06, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at(19.2));
          PX.burst(tl, "#s4-cam", 512, 1160, at(19.25), { n: 14, r: 260, seed: 48 });
          tl.to("#s4-cam", { x: -1080, filter: "blur(16px)", duration: 0.18, ease: "power3.in" }, at(19.47));
          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
