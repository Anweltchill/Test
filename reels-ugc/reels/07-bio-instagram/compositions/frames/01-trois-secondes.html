<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s1-cam { position: absolute; inset: 0; }
        #s1-prof { position: absolute; left: 112px; top: 300px; width: 800px; height: 400px; display: block; }
        #s1-avw { position: absolute; left: 36px; top: 36px; width: 170px; height: 170px; border-radius: 50%; padding: 6px; background: linear-gradient(45deg, #F9CE34, #EE2A7B 55%, #6228D7); display: block; }
        #s1-avin { width: 100%; height: 100%; border-radius: 50%; background: #FDF4ED; display: flex; align-items: center; justify-content: center; }
        #s1-av { width: 120px; height: 120px; }
        #s1-ps { position: absolute; left: 240px; top: 60px; font: 600 44px "PxSans", sans-serif; display: block; }
        #s1-nm { position: absolute; left: 240px; top: 124px; font-size: 38px; color: #CC7183; display: block; }
        .s1-ln { position: absolute; left: 36px; height: 24px; border-radius: 12px; background: #E6BDC1; display: block; }
        #s1-ln1 { top: 250px; width: 560px; }
        #s1-ln2 { top: 296px; width: 460px; }
        #s1-ln3 { top: 342px; width: 300px; }
        #s1-br { position: absolute; left: 640px; top: 250px; display: flex; align-items: center; gap: 14px; background: #0E1928; color: #FDF4ED; border-radius: 999px; padding: 12px 30px 12px 14px; font: 600 36px "PxSans", sans-serif; }
        #s1-bri { width: 74px; height: 74px; }
        #s1-eyes { position: absolute; left: 700px; top: 560px; width: 110px; height: 110px; opacity: 0; }
        #s1-sww { position: absolute; left: 302px; top: 780px; width: 420px; height: 420px; display: block; }
        #s1-ring { position: absolute; inset: 0; width: 420px; height: 420px; display: block; }
        #s1-sw { position: absolute; left: -40px; top: -40px; width: 150px; height: 150px; }
        #s1-n { position: absolute; left: 0; right: 0; top: 110px; text-align: center; font-size: 170px; color: #0E1928; display: block; }
        #s1-s { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-size: 34px; display: block; }
      </style>
      <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div id="s1-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s1-prof" class="card">
            <div id="s1-avw"><div id="s1-avin"><img id="s1-av" class="img3d" src="assets/lib/emoji/woman-raising-hand.png" alt="" /></div></div>
            <span id="s1-ps">ton.profil</span>
            <span id="s1-nm" class="t-serif">Ta bio</span>
            <span id="s1-ln1" class="s1-ln"></span><span id="s1-ln2" class="s1-ln"></span><span id="s1-ln3" class="s1-ln"></span>
          </div>
          <img id="s1-eyes" class="img3d" src="assets/lib/emoji/eyes.png" alt="" />
          <div id="s1-br"><img id="s1-bri" class="img3d" src="assets/lib/emoji/shopping-bags.png" alt="" />Brand X</div>
          <div id="s1-sww">
            <svg id="s1-ring" viewBox="0 0 420 420"><circle cx="210" cy="210" r="190" fill="#FDF4ED" stroke="#E6BDC1" stroke-width="18" /><circle id="s1-arc" cx="210" cy="210" r="190" fill="none" stroke="#E2718D" stroke-width="18" stroke-linecap="round" stroke-dasharray="1194" stroke-dashoffset="0" transform="rotate(-90 210 210)" /></svg>
            <span id="s1-n" class="t-serif">3</span>
            <span id="s1-s" class="t-label">secondes</span>
            <img id="s1-sw" class="img3d" src="assets/lib/emoji/stopwatch.png" alt="" />
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // « marque » 0.32 · « profil » 1.20 · « 3 secondes » 2.00–2.24 · « comprendre ce que tu fais » 2.72–3.44
          tl.fromTo("#s1-prof", { y: 300, opacity: 0, rotationX: -25 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.5, ease: "expo.out", transformPerspective: 1400 }, 0.0);
          tl.fromTo("#s1-av", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 0.2);
          ["#s1-ln1", "#s1-ln2", "#s1-ln3"].forEach((l, i) => tl.fromTo(l, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 0.3 + i * 0.08));
          tl.fromTo("#s1-br", { x: 600, rotation: 10 }, { x: 0, rotation: 0, duration: 0.5, ease: "back.out(1.6)" }, 0.3);
          tl.fromTo("#s1-bri", { rotation: -30 }, { rotation: 0, duration: 0.6, ease: "elastic.out(1, 0.5)" }, 0.6);
          tl.fromTo("#s1-eyes", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(3)" }, 1.15);
          tl.fromTo("#s1-eyes", { x: 0 }, { x: -260, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 1.45);
          tl.fromTo("#s1-sww", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, 1.85);
          tl.fromTo("#s1-sw", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 2.05);
          tl.fromTo("#s1-arc", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": 1194 }, duration: 1.4, ease: "none" }, 2.1);
          const n = document.querySelector("#s1-n");
          const c = { _v: 3, get v() { return this._v; }, set v(x) { this._v = x; n.textContent = String(Math.max(0, Math.ceil(x))); } };
          tl.fromTo(c, { v: 3 }, { v: 0, duration: 1.4, ease: "none" }, 2.1);
          tl.fromTo("#s1-sw", { rotation: -12 }, { rotation: 12, duration: 0.1, yoyo: true, repeat: 13, ease: "none", immediateRender: false }, 2.1);
          tl.fromTo("#s1-sww", { scale: 1 }, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 3.4);
          tl.to("#s1-cam", { x: -1080, filter: "blur(16px)", duration: 0.22, ease: "power3.in" }, 3.4);
          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
