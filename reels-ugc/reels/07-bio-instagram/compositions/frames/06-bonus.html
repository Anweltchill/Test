<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s6-cam { position: absolute; inset: 0; }
        #s6-bon { position: absolute; left: 0; right: 56px; top: 280px; text-align: center; display: block; }
        #s6-bp { display: inline-flex; align-items: center; gap: 16px; background: #E2718D; color: #FDF4ED; border-radius: 999px; padding: 10px 40px 10px 14px; font: 600 52px "PxSans", sans-serif; letter-spacing: 0.1em; }
        #s6-gift { width: 90px; height: 90px; }
        #s6-l2 { position: absolute; left: 64px; right: 120px; top: 440px; text-align: center; font-size: 84px; display: block; white-space: nowrap; }
        #s6-card { position: absolute; left: 112px; top: 600px; width: 800px; height: 480px; display: block; }
        .s6-row { position: absolute; left: 40px; right: 40px; height: 110px; border-radius: 24px; background: #F0E6DD; display: block; }
        #s6-r1 { top: 40px; }
        #s6-r2 { top: 185px; }
        #s6-r3 { top: 330px; }
        .s6-bl { position: absolute; left: 30px; top: 42px; height: 26px; border-radius: 13px; background: #8F9AC3; filter: blur(6px); display: block; }
        #s6-r1 .s6-bl { width: 520px; }
        #s6-r2 .s6-bl { width: 420px; }
        #s6-r3 .s6-bl { width: 560px; }
        .s6-st { position: absolute; left: 16px; right: 16px; top: 50px; height: 10px; border-radius: 5px; background: #E2718D; display: block; transform-origin: 0% 50%; }
        #s6-bin { position: absolute; left: 437px; top: 1120px; width: 150px; height: 150px; }
      </style>
      <div id="root" data-composition-id="s6" data-width="1080" data-height="1920">
        <div id="s6-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s6-bon"><span id="s6-bp"><img id="s6-gift" class="img3d" src="assets/lib/emoji/wrapped-gift.png" alt="" />BONUS</span></div>
          <span id="s6-l2" class="t-serif">Les infos à <span class="acc">retirer</span></span>
          <div id="s6-card" class="card">
            <div id="s6-r1" class="s6-row"><span class="s6-bl"></span><span class="s6-st"></span></div>
            <div id="s6-r2" class="s6-row"><span class="s6-bl"></span><span class="s6-st"></span></div>
            <div id="s6-r3" class="s6-row"><span class="s6-bl"></span><span class="s6-st"></span></div>
          </div>
          <img id="s6-bin" class="img3d" src="assets/lib/emoji/wastebasket.png" alt="" />
        </div>
      </div>
      <script>
        (function () {
          const T0 = 25.25, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « Bonus » 25.36 · « infos » 26.72 · « absolument » 27.60 · « retirer » 28.08 · « bio » 28.80
          tl.fromTo("#s6-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, 0);
          tl.fromTo("#s6-bon", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.6)" }, at(25.3));
          tl.fromTo("#s6-gift", { rotation: -30, scale: 0 }, { rotation: 0, scale: 1, duration: 0.5, ease: "back.out(3)" }, at(25.4));
          PX.burst(tl, "#s6-cam", 470, 330, at(25.6), { n: 14, r: 260, seed: 61 });
          tl.fromTo("#s6-l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, at(26.6));
          tl.fromTo("#s6-card", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, at(26.65));
          ["#s6-r1", "#s6-r2", "#s6-r3"].forEach((r, i) => {
            tl.fromTo(r + " .s6-st", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, at(27.55 + i * 0.2));
            // les lignes barrées tombent dans la corbeille
            tl.to(r, { x: 0, y: 540 - [40, 185, 330][i], scale: 0.2, opacity: 0, rotation: 20, duration: 0.4, ease: "power2.in" }, at(28.1 + i * 0.12));
          });
          tl.fromTo("#s6-bin", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(27.9));
          tl.fromTo("#s6-bin", { scaleX: 1, scaleY: 1 }, { scaleX: 1.12, scaleY: 0.88, duration: 0.08, yoyo: true, repeat: 5, ease: "power2.out", immediateRender: false }, at(28.45));
          tl.to("#s6-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(28.9));
          window.__timelines["s6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
