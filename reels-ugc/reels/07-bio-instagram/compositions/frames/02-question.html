<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s2-cam { position: absolute; inset: 0; }
        #s2-l1 { position: absolute; left: 64px; right: 120px; top: 290px; text-align: center; font-size: 40px; display: block; }
        #s2-l2 { position: absolute; left: 64px; right: 120px; top: 350px; text-align: center; font-size: 96px; display: block; white-space: nowrap; }
        #s2-one { position: absolute; left: 432px; top: 500px; width: 160px; height: 160px; border-radius: 50%; background: #E2718D; color: #FDF4ED; font-size: 110px; display: flex; align-items: center; justify-content: center; }
        #s2-q { position: absolute; left: 112px; top: 720px; width: 800px; height: 420px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 60px; }
        #s2-qt { font-size: 88px; line-height: 1.1; display: block; }
        #s2-thw { position: absolute; left: 70px; top: 640px; width: 170px; height: 170px; display: block; }
        #s2-th { width: 170px; height: 170px; }
        #s2-handw { position: absolute; left: 640px; top: 1110px; width: 160px; height: 160px; display: block; }
        #s2-hand { width: 160px; height: 160px; }
      </style>
      <div id="root" data-composition-id="s2" data-width="1080" data-height="1920">
        <div id="s2-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s2-l1" class="t-label">Ta bio doit répondre à</span>
          <span id="s2-l2" class="t-serif">une <span class="acc">seule</span> question</span>
          <div id="s2-one" class="t-serif">1</div>
          <div id="s2-q" class="card"><span id="s2-qt" class="t-serif">Pourquoi te contacter, <span class="t-italic acc">toi</span> ?</span></div>
          <div id="s2-thw"><img id="s2-th" class="img3d" src="assets/lib/emoji/thinking-face.png" alt="" /></div>
          <div id="s2-handw"><img id="s2-hand" class="img3d" src="assets/lib/emoji/backhand-index-pointing-up.png" alt="" /></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 3.6, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « bio » 4.16 · « seule question » 5.36–5.60 · « Pourquoi » 6.24 · « toi » 7.60
          tl.fromTo("#s2-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out" }, 0);
          tl.fromTo("#s2-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35 }, at(3.75));
          tl.fromTo("#s2-l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, at(5.1));
          tl.fromTo("#s2-one", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.5)" }, at(5.3));
          PX.burst(tl, "#s2-cam", 512, 580, at(5.55), { n: 12, r: 220, size: 14, seed: 12 });
          tl.fromTo("#s2-q", { scale: 0.6, opacity: 0, rotation: -4 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, at(6.1));
          tl.fromTo("#s2-th", { scale: 0, rotation: 30 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, at(6.4));
          PX.float(tl, "#s2-thw", at(6.85), 1.2, 8, 0.6, 6);
          tl.fromTo("#s2-hand", { scale: 0, y: 100 }, { scale: 1, y: 0, duration: 0.4, ease: "back.out(3)" }, at(7.4));
          tl.fromTo("#s2-handw", { y: 0 }, { y: -24, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at(7.62));
          tl.fromTo("#s2-q", { scale: 1 }, { scale: 1.05, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at(7.62));
          tl.to("#s2-cam", { x: -1080, filter: "blur(16px)", duration: 0.22, ease: "power3.in" }, at(7.9));
          window.__timelines["s2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
