      <script>
        (function () {
          const T0 = 28.21, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « listé » 28.45 · « agences » 28.93 · « plateformes » 29.57 · « conseils » 31.17 · « Envoie-moi » 32.21 · « liste » 32.85 · « privé » 33.65
          tl.fromTo("#s8-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, 0);
          tl.fromTo("#s8-list", { y: 300, opacity: 0, rotationX: -25 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.5, ease: "expo.out", transformPerspective: 1400 }, at(28.25));
          tl.fromTo("#s8-bk", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, at(28.4));
          tl.fromTo("#s8-ta", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, at(28.9));
          tl.fromTo("#s8-tp", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, at(29.5));
          const L = document.querySelector("#s8-list"), W = [360, 300, 420, 340];

            L.appendChild(r);
            tl.fromTo(r, { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, at(29.9 + i * 0.12));
            tl.fromTo(r.querySelector(".s8-tg"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, at(31.1 + i * 0.08));
          });
          // la liste défile : on ne lit rien
          tl.fromTo(".s8-bl", { x: 0 }, { x: -20, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, at(30.4));
          tl.fromTo("#s8-stamp", { scale: 2.4, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: -5, duration: 0.3, ease: "power4.in" }, at(31.5));
          tl.fromTo("#s8-list", { x: 0 }, { x: 10, duration: 0.05, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, at(31.8));
          tl.fromTo("#s8-dm", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, at(32.0));
          tl.fromTo("#s8-ig", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, at(32.15));
          const txt = document.querySelector("#s8-txt"), ph = document.querySelector("#s8-ph"), M = "LISTE";
          const ty = { _v: 0, get v() { return this._v; }, set v(x) { this._v = x; const n = Math.round(x); txt.textContent = M.slice(0, n); ph.style.display = n > 0 ? "none" : "block"; } };
          tl.fromTo(ty, { v: 0 }, { v: 5, duration: 0.4, ease: "none" }, at(32.6));
          tl.fromTo("#s8-send", { scale: 1 }, { scale: 0.82, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.in", immediateRender: false }, at(33.15));

          window.__timelines["s8"] = tl;
        })();
