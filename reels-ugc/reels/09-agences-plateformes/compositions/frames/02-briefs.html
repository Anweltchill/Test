<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s2-cam { position: absolute; inset: 0; }
        .s2-src { position: absolute; top: 300px; width: 360px; height: 360px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
        #s2-a { left: 112px; }
        #s2-p { left: 552px; }
        .s2-i { width: 180px; height: 180px; }
        .s2-n { font-size: 54px; display: block; }
        #s2-mew { position: absolute; left: 412px; top: 960px; width: 200px; height: 200px; display: block; }
        #s2-me { width: 200px; height: 200px; }
        .s2-brief { position: absolute; width: 110px; height: 110px; opacity: 0; }
        #s2-t { position: absolute; left: 64px; right: 120px; top: 790px; text-align: center; font-size: 66px; display: block; white-space: nowrap; }
      </style>
      <div id="root" data-composition-id="s2" data-width="1080" data-height="1920">
        <div id="s2-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s2-a" class="s2-src card"><img class="s2-i img3d" src="assets/lib/emoji/office-building.png" alt="" /><span class="s2-n t-serif">Agences</span></div>
          <div id="s2-p" class="s2-src card"><img class="s2-i img3d" src="assets/lib/emoji/laptop.png" alt="" /><span class="s2-n t-serif">Plateformes</span></div>
          <span id="s2-t" class="t-serif">qui t'apportent des <span class="acc">briefs</span></span>
          <div id="s2-mew"><img id="s2-me" class="img3d" src="assets/lib/emoji/woman-raising-hand.png" alt="" /></div>
          <img id="s2-b1" style="left:240px;top:640px" class="s2-brief img3d" src="assets/lib/emoji/memo.png" alt="" />
          <img id="s2-b2" style="left:300px;top:660px" class="s2-brief img3d" src="assets/lib/emoji/memo.png" alt="" />
          <img id="s2-b3" style="left:680px;top:640px" class="s2-brief img3d" src="assets/lib/emoji/memo.png" alt="" />
          <img id="s2-b4" style="left:740px;top:660px" class="s2-brief img3d" src="assets/lib/emoji/memo.png" alt="" />
        </div>
      </div>
      <script>
        (function () {
          const T0 = 2.0, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « agences » 3.28 · « plateformes » 3.84 · « t'apportent » 4.32 · « briefs » 4.88
          tl.fromTo("#s2-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s2-a", { y: -1000, rotation: -8 }, { y: 0, rotation: 0, duration: 0.5, ease: "bounce.out" }, at(3.15));
          tl.fromTo("#s2-p", { y: -1000, rotation: 8 }, { y: 0, rotation: 0, duration: 0.5, ease: "bounce.out" }, at(3.7));
          tl.fromTo("#s2-me", { scale: 0, y: 100 }, { scale: 1, y: 0, duration: 0.4, ease: "back.out(3)" }, at(2.2));
          PX.float(tl, "#s2-mew", at(2.6), 2.6, 8, 0.9, 4);
          tl.fromTo("#s2-t", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, at(4.25));
          [["#s2-b1", 240, 640], ["#s2-b2", 300, 660], ["#s2-b3", 680, 640], ["#s2-b4", 740, 660]].forEach(([b, x, y], i) => {
            tl.fromTo(b, { opacity: 1, scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.25, ease: "back.out(3)" }, at(4.4 + i * 0.08));
            tl.to(b, { x: 460 - x, y: 1000 - y, scale: 0.6, rotation: 15, duration: 0.45, ease: "power2.in" }, at(4.7 + i * 0.08));
            tl.to(b, { opacity: 0, duration: 0.08 }, at(5.15 + i * 0.08));
          });
          tl.fromTo("#s2-mew", { scale: 1 }, { scale: 1.15, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at(5.1));
          PX.burst(tl, "#s2-cam", 512, 1060, at(5.12), { n: 12, r: 220, size: 14, seed: 22 });
          tl.to("#s2-cam", { x: -1080, filter: "blur(16px)", duration: 0.18, ease: "power3.in" }, at(5.26));
          window.__timelines["s2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
