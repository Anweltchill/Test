<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s4-cam { position: absolute; inset: 0; }
        #s4-t { position: absolute; left: 0; right: 56px; top: 290px; text-align: center; display: block; }
        #s4-tp { display: inline-flex; align-items: center; gap: 20px; font-size: 92px; }
        #s4-plus { width: 100px; height: 100px; }
        .s4-c { position: absolute; left: 112px; width: 800px; height: 230px; display: flex; align-items: center; gap: 28px; padding: 0 34px; }
        #s4-c1 { top: 470px; }
        #s4-c2 { top: 730px; }
        #s4-c3 { top: 990px; }
        .s4-i { width: 140px; height: 140px; flex: none; }
        .s4-tx { font-size: 52px; line-height: 1.1; display: block; flex: 1; }
        .s4-sm { width: 96px; height: 96px; flex: none; }
        #s4-xw { position: absolute; right: 34px; top: 67px; width: 96px; height: 96px; display: block; }
        #s4-x { position: absolute; left: 0; top: 0; width: 96px; height: 96px; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
        <div id="s4-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s4-t"><span id="s4-tp" class="t-serif"><img id="s4-plus" class="img3d" src="assets/lib/emoji/plus.png" alt="" />Les <span class="acc">avantages</span></span></div>
          <div id="s4-c1" class="s4-c card"><img class="s4-i img3d" src="assets/lib/emoji/chart-increasing.png" alt="" /><span class="s4-tx t-serif">Plus d'<span class="acc">opportunités</span></span></div>
          <div id="s4-c2" class="s4-c card"><img class="s4-i img3d" src="assets/lib/emoji/handshake.png" alt="" /><span class="s4-tx t-serif">Partenariats sous <span class="acc">contrat</span></span><img class="s4-sm img3d" src="assets/lib/emoji/receipt.png" alt="" /></div>
          <div id="s4-c3" class="s4-c card"><img class="s4-i img3d" src="assets/lib/emoji/movie-camera.png" alt="" /><span class="s4-tx t-serif">Tes rushs, <span class="acc">sans montage</span></span><div id="s4-xw"><img class="s4-sm img3d" src="assets/lib/emoji/scissors.png" alt="" /><img id="s4-x" class="img3d" src="assets/lib/emoji/cross-mark.png" alt="" /></div></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 7.6, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « avantages » 7.92 · « opportunités » 9.04 · « contrat » 11.04 · « rushs » 13.36 · « sans montage » 13.92–14.16
          tl.fromTo("#s4-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s4-tp", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power4.out" }, at(7.8));
          tl.fromTo("#s4-plus", { rotation: -180, scale: 0 }, { rotation: 0, scale: 1, duration: 0.5, ease: "back.out(2.5)" }, at(7.9));
          [["#s4-c1", 8.85], ["#s4-c2", 10.05], ["#s4-c3", 12.75]].forEach(([c, t], i) => {
            tl.fromTo(c, { x: i % 2 ? 900 : -900, rotation: i % 2 ? 4 : -4 }, { x: 0, rotation: 0, duration: 0.45, ease: "back.out(1.4)" }, at(t));
            tl.fromTo(c + " .s4-i", { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, at(t + 0.1));
          });
          tl.fromTo("#s4-c1 .s4-i", { y: 0 }, { y: -20, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, at(9.4));
          tl.fromTo("#s4-c2 .s4-sm", { scale: 0, rotation: 40 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, at(10.95));
          PX.burst(tl, "#s4-cam", 860, 845, at(11.1), { n: 10, r: 150, size: 14, seed: 41 });
          tl.fromTo("#s4-c3 .s4-sm", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(13.3));
          tl.fromTo("#s4-x", { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.in" }, at(14.05));
          tl.fromTo("#s4-c3", { x: 0 }, { x: 10, duration: 0.05, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, at(14.3));
          tl.to("#s4-cam", { y: -500, opacity: 0, filter: "blur(14px)", duration: 0.2, ease: "power3.in" }, at(14.58));
          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
