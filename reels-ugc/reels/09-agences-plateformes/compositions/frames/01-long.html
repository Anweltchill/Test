<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s1-cam { position: absolute; inset: 0; }
        #s1-l1 { position: absolute; left: 64px; right: 120px; top: 290px; text-align: center; font-size: 32px; display: block; white-space: nowrap; }
        #s1-l2 { position: absolute; left: 64px; right: 120px; top: 350px; text-align: center; font-size: 104px; display: block; white-space: nowrap; }
        #s1-mgw { position: absolute; left: 392px; top: 560px; width: 240px; height: 240px; display: block; }
        #s1-mg { width: 240px; height: 240px; }
        .s1-q { position: absolute; width: 110px; height: 110px; border-radius: 50%; background: #FDF4ED; border: 4px dashed #DB96A1; display: block; }
        #s1-hg { position: absolute; left: 700px; top: 900px; width: 170px; height: 170px; }
        #s1-bar { position: absolute; left: 152px; top: 1150px; width: 720px; height: 40px; border-radius: 20px; background: #E6BDC1; overflow: hidden; display: block; }
        #s1-fill { width: 100%; height: 100%; background: #E2718D; display: block; }
      </style>
      <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div id="s1-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s1-l1" class="t-label">Trouver des marques toute seule</span>
          <span id="s1-l2" class="t-serif">c'est <span class="t-italic acc">long…</span></span>
          <div id="s1-mgw"><img id="s1-mg" class="img3d" src="assets/lib/emoji/magnifying-glass-tilted-left.png" alt="" /></div>
          <img id="s1-hg" class="img3d" src="assets/lib/emoji/hourglass-not-done.png" alt="" />
          <div id="s1-bar"><div id="s1-fill"></div></div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // « marques » 0.48 · « long » 1.60
          tl.fromTo("#s1-l1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35 }, 0.0);
          const cam = document.querySelector("#s1-cam"), P = [[150, 600], [800, 620], [180, 900], [470, 920], [820, 760]];
          P.forEach(([x, y], i) => {
            const d = document.createElement("div"); d.className = "s1-q"; d.style.left = x + "px"; d.style.top = y + "px"; cam.appendChild(d);
            tl.fromTo(d, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.2 + i * 0.08);
            tl.fromTo(d, { opacity: 1 }, { opacity: 0.4, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, 0.6 + i * 0.05);
          });
          tl.fromTo("#s1-mg", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, 0.1);
          tl.fromTo("#s1-mgw", { x: 0, y: 0 }, { x: -220, y: 60, duration: 0.45, ease: "sine.inOut" }, 0.5);
          tl.to("#s1-mgw", { x: 260, y: 140, duration: 0.5, ease: "sine.inOut" }, 0.95);
          tl.to("#s1-mgw", { x: 0, y: 0, duration: 0.4, ease: "sine.inOut" }, 1.45);
          tl.fromTo("#s1-l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power4.out" }, 1.45);
          tl.fromTo("#s1-bar", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3 }, 0.4);
          tl.fromTo("#s1-fill", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 0.12, duration: 1.4, ease: "none" }, 0.5);
          tl.fromTo("#s1-hg", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 1.4);
          tl.fromTo("#s1-hg", { rotation: 0 }, { rotation: 180, duration: 0.4, ease: "power2.inOut", immediateRender: false }, 1.6);
          tl.to("#s1-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, 1.82);
          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
