<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s2-cam { position: absolute; inset: 0; }
        #s2-l1 { position: absolute; left: 64px; right: 120px; top: 290px; text-align: center; font-size: 120px; display: block; white-space: nowrap; }
        #s2-l2 { position: absolute; left: 64px; right: 120px; top: 460px; text-align: center; font-size: 40px; display: block; }
        .s2-w { position: absolute; top: 580px; width: 380px; height: 420px; display: flex; align-items: center; justify-content: center; }
        #s2-w1 { left: 112px; }
        #s2-w2 { left: 532px; }
        .s2-n { font-size: 200px; color: #E2718D; display: block; }
        #s2-q { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
        #s2-brw { position: absolute; left: 442px; top: 1060px; width: 140px; height: 140px; display: block; }
        #s2-br { width: 140px; height: 140px; }
      </style>
      <div id="root" data-composition-id="s2" data-width="1080" data-height="1920">
        <div id="s2-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s2-l1" class="t-serif">Comment <span class="acc">?</span></span>
          <span id="s2-l2" class="t-label">Deux mots que les marques connaissent</span>
          <div id="s2-w1" class="s2-w card"><span class="s2-n t-serif">1</span></div>
          <div id="s2-w2" class="s2-w card"><span class="s2-n t-serif">2</span></div>
          <div id="s2-brw"><img id="s2-br" class="img3d" src="assets/lib/emoji/shopping-bags.png" alt="" /></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 3.0, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « Comment » 3.12 · « deux mots » 4.08–4.24 · « marques connaissent » 4.80–5.12
          tl.fromTo("#s2-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s2-l1", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, at(3.05));
          tl.fromTo("#s2-l2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, at(3.9));
          tl.fromTo("#s2-w1", { rotationY: 90, opacity: 0 }, { rotationY: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)", transformPerspective: 1200 }, at(4.05));
          tl.fromTo("#s2-w2", { rotationY: 90, opacity: 0 }, { rotationY: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)", transformPerspective: 1200 }, at(4.2));
          tl.fromTo("#s2-br", { scale: 0, y: 80 }, { scale: 1, y: 0, duration: 0.4, ease: "back.out(3)" }, at(4.8));
          tl.fromTo("#s2-brw", { rotation: -10 }, { rotation: 10, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, at(5.2));
          tl.fromTo(".s2-w", { y: 0 }, { y: -16, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut", stagger: 0.1, immediateRender: false }, at(5.4));
          tl.to("#s2-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(5.86));
          window.__timelines["s2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
