<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s3-cam { position: absolute; inset: 0; }
        #s3-n { position: absolute; left: 64px; right: 120px; top: 270px; text-align: center; font-size: 34px; display: block; }
        #s3-l1 { position: absolute; left: 64px; right: 120px; top: 320px; text-align: center; font-size: 130px; display: block; white-space: nowrap; }
        .s3-v { position: absolute; top: 560px; width: 240px; height: 400px; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; box-shadow: 0 18px 44px rgba(14, 25, 40, 0.16); }
        #s3-v1 { left: 392px; background: #E6BDC1; }
        #s3-v2 { left: 392px; background: #C2C7DD; }
        #s3-v3 { left: 392px; background: #DB96A1; }
        .s3-vi { width: 130px; height: 130px; }
        .s3-vt { font: 600 34px "PxSans", sans-serif; color: #0E1928; display: block; }
        .s3-pl { width: 60px; height: 60px; }
        #s3-pack { position: absolute; left: 92px; top: 520px; width: 840px; height: 480px; border-radius: 40px; border: 6px dashed #E2718D; opacity: 0; display: block; }
        #s3-tag { position: absolute; left: 0; right: 56px; top: 1060px; text-align: center; display: block; }
        #s3-tg { display: inline-flex; align-items: center; gap: 14px; background: #0E1928; color: #FDF4ED; border-radius: 999px; padding: 12px 40px 12px 16px; font: 600 44px "PxSans", sans-serif; }
        #s3-tgi { width: 80px; height: 80px; }
      </style>
      <div id="root" data-composition-id="s3" data-width="1080" data-height="1920">
        <div id="s3-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s3-n" class="t-label">Mot n°1</span>
          <span id="s3-l1" class="t-serif">Le <span class="acc">bundle</span></span>
          <div id="s3-pack"></div>
          <div id="s3-v3" class="s3-v"><img class="s3-vi img3d" src="assets/lib/emoji/lipstick.png" alt="" /><span class="s3-vt">Version C</span><img class="s3-pl" src="assets/lib/emoji/play-button.png" alt="" /></div>
          <div id="s3-v2" class="s3-v"><img class="s3-vi img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /><span class="s3-vt">Version B</span><img class="s3-pl" src="assets/lib/emoji/play-button.png" alt="" /></div>
          <div id="s3-v1" class="s3-v"><img class="s3-vi img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /><span class="s3-vt">Version A</span><img class="s3-pl" src="assets/lib/emoji/play-button.png" alt="" /></div>
          <div id="s3-tag"><span id="s3-tg"><img id="s3-tgi" class="img3d" src="assets/lib/emoji/package.png" alt="" />Un pack, pas une vidéo</span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 6.06, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « bundle » 6.30 · « une vidéo » 7.42–7.66 · « ensemble » 8.86 · « versions à tester » 9.82–10.30 · « totalement différentes » 11.50–11.90
          tl.fromTo("#s3-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s3-n", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3 }, at(6.1));
          PX.letters(tl, "#s3-l1", at(6.2), { y: 110, stagger: 0.035, dur: 0.4 });
          // 1 vidéo…
          tl.fromTo("#s3-v1", { scale: 0, rotation: -10 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, at(7.3));
          tl.fromTo(["#s3-v2", "#s3-v3"], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
          // … devient un ensemble
          tl.fromTo("#s3-v2", { opacity: 1, x: 0, rotation: 0 }, { x: -290, rotation: -6, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, at(8.75));
          tl.fromTo("#s3-v3", { opacity: 1, x: 0, rotation: 0 }, { x: 290, rotation: 6, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, at(8.85));
          tl.fromTo("#s3-pack", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at(9.0));
          tl.fromTo("#s3-tag", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, at(9.1));
          tl.fromTo("#s3-tgi", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, at(9.25));
          // « versions à tester » : A/B qui alternent
          tl.fromTo(["#s3-v1", "#s3-v2", "#s3-v3"], { y: 0 }, { y: -30, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", stagger: 0.15, immediateRender: false }, at(9.8));
          // « vidéos totalement différentes » : les produits changent
          tl.fromTo("#s3-v2 .s3-vi", { rotationY: 0 }, { rotationY: 360, duration: 0.6, ease: "power2.inOut", immediateRender: false }, at(11.4));
          tl.fromTo("#s3-v3 .s3-vi", { rotationY: 0 }, { rotationY: 360, duration: 0.6, ease: "power2.inOut", immediateRender: false }, at(11.55));
          PX.burst(tl, "#s3-cam", 512, 760, at(11.9), { n: 16, r: 420, seed: 31 });
          tl.to("#s3-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(12.3));
          window.__timelines["s3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
