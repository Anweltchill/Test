<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s4-cam { position: absolute; inset: 0; }
        #s4-inv { position: absolute; left: 112px; top: 290px; width: 800px; height: 560px; display: block; }
        #s4-rc { position: absolute; left: 36px; top: 30px; width: 100px; height: 100px; }
        #s4-it { position: absolute; left: 160px; top: 48px; font-size: 56px; display: block; }
        .s4-row { position: absolute; left: 36px; right: 36px; height: 60px; display: flex; align-items: center; gap: 20px; }
        .s4-bl { height: 22px; border-radius: 11px; background: #E6BDC1; display: block; }
        .s4-pr { margin-left: auto; width: 110px; height: 22px; border-radius: 11px; background: #C2C7DD; filter: blur(4px); display: block; }
        #s4-bar { position: absolute; left: 36px; right: 36px; bottom: 40px; height: 70px; border-radius: 35px; background: #F0E6DD; overflow: hidden; display: block; }
        #s4-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #DB96A1, #E2718D); display: block; }
        #s4-up { position: absolute; left: 780px; top: 230px; width: 150px; height: 150px; }
        #s4-tr { position: absolute; left: 112px; top: 910px; width: 800px; height: 260px; display: flex; align-items: center; gap: 26px; padding: 0 36px; }
        #s4-hs { width: 140px; height: 140px; flex: none; }
        #s4-cal { width: 110px; height: 110px; flex: none; }
        #s4-trt { font-size: 52px; line-height: 1.1; display: block; flex: 1; }
      </style>
      <div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
        <div id="s4-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s4-inv" class="card">
            <img id="s4-rc" class="img3d" src="assets/lib/emoji/receipt.png" alt="" />
            <span id="s4-it" class="t-serif">Ta <span class="acc">facture</span></span>
            <div id="s4-bar"><div id="s4-fill"></div></div>
          </div>
          <img id="s4-up" class="img3d" src="assets/lib/emoji/chart-increasing.png" alt="" />
          <div id="s4-tr" class="card"><img id="s4-hs" class="img3d" src="assets/lib/emoji/handshake.png" alt="" /><span id="s4-trt" class="t-serif">Confiance sur la <span class="acc">durée</span></span><img id="s4-cal" class="img3d" src="assets/lib/emoji/spiral-calendar.png" alt="" /></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 12.5, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « facture augmente » 12.86–13.34 · « confiance » 14.62 · « durée » 15.26
          tl.fromTo("#s4-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s4-inv", { y: 300, opacity: 0, rotationX: -25 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.45, ease: "expo.out", transformPerspective: 1400 }, at(12.55));
          tl.fromTo("#s4-rc", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, at(12.7));
          const inv = document.querySelector("#s4-inv"), W = [420, 360, 460, 300];
          W.forEach((w, i) => {
            const r = document.createElement("div"); r.className = "s4-row"; r.style.top = 160 + i * 70 + "px";
            r.innerHTML = '<span class="s4-bl" style="width:' + w + 'px"></span><span class="s4-pr"></span>'; inv.appendChild(r);
            tl.fromTo(r, { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, at(12.85 + i * 0.12));
          });
          tl.fromTo("#s4-fill", { scaleX: 0.2, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, at(13.2));
          tl.fromTo("#s4-up", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, at(13.35));
          PX.burst(tl, "#s4-cam", 855, 305, at(13.6), { n: 12, r: 200, size: 14, seed: 42 });
          tl.fromTo("#s4-tr", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, at(14.45));
          tl.fromTo("#s4-hs", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, at(14.6));
          tl.fromTo("#s4-cal", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(15.2));
          tl.to("#s4-cam", { y: -500, opacity: 0, filter: "blur(14px)", duration: 0.2, ease: "power3.in" }, at(15.46));
          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
