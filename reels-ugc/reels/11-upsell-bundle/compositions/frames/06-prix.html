<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s6-cam { position: absolute; inset: 0; }
        #s6-dark { position: absolute; left: 50px; right: 50px; top: 240px; height: 1090px; border-radius: 48px; background: #0E1928; opacity: 0; display: block; }
        #s6-l1 { position: absolute; left: 64px; right: 120px; top: 300px; text-align: center; font-size: 40px; color: #E6BDC1; display: block; }
        #s6-l2 { position: absolute; left: 64px; right: 120px; top: 360px; text-align: center; font-size: 100px; color: #FDF4ED; display: block; white-space: nowrap; }
        .s6-r { position: absolute; left: 132px; width: 760px; height: 130px; border-radius: 30px; background: #172742; display: flex; align-items: center; gap: 22px; padding: 0 26px; }
        .s6-i { width: 80px; height: 80px; flex: none; }
        #root .s6-t { font-size: 44px; color: #FDF4ED; display: block; flex: 1; }
        .s6-tag { position: relative; width: 200px; height: 74px; flex: none; display: block; }
        .s6-p { position: absolute; inset: 0; border-radius: 16px; background: #E2718D; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .s6-pb { width: 110px; height: 22px; border-radius: 11px; background: #FDF4ED; filter: blur(5px); display: block; }
        .s6-g { position: absolute; inset: 0; border-radius: 16px; background: #FDF4ED; color: #0E1928; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 30px "PxSans", sans-serif; opacity: 0; }
        .s6-gi { width: 50px; height: 50px; }
        #s6-warn { position: absolute; left: 452px; top: 1180px; width: 120px; height: 120px; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s6" data-width="1080" data-height="1920">
        <div id="s6-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s6-dark"></div>
          <span id="s6-l1" class="t-label">Chaque option</span>
          <span id="s6-l2" class="t-serif">a son <span class="acc">prix</span></span>
          <img id="s6-warn" class="img3d" src="assets/lib/emoji/warning.png" alt="" />
        </div>
      </div>
      <script>
        (function () {
          const T0 = 22.9, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // chuchoté : « option » 23.30 · « prix » 23.94 · « débutantes » 24.90 · « offrent gratuitement » 25.78–26.18
          tl.fromTo("#s6-dark", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 0);
          tl.fromTo("#s6-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4 }, at(23.0));
          tl.fromTo("#s6-l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at(23.7));
          const cam = document.querySelector("#s6-cam");
          const O = [["Accroches", "fishing-pole"], ["Voix off", "studio-microphone"], ["Montage", "scissors"], ["Script", "memo"], ["Rushs", "movie-camera"]];
          O.forEach(([t, ic], i) => {
            const r = document.createElement("div"); r.className = "s6-r"; r.style.top = 530 + i * 128 + "px"; r.style.height = "112px";
            r.innerHTML = '<img class="s6-i img3d" src="assets/lib/emoji/' + ic + '.png" alt="" /><span class="s6-t t-serif">' + t + '</span><span class="s6-tag"><span class="s6-p"><img class="s6-gi img3d" src="assets/lib/emoji/label.png" alt="" /><span class="s6-pb"></span></span><span class="s6-g"><img class="s6-gi img3d" src="assets/lib/emoji/wrapped-gift.png" alt="" />Offert</span></span>';
            cam.appendChild(r);
            tl.fromTo(r, { x: i % 2 ? 900 : -900, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, at(23.2 + i * 0.1));
            tl.fromTo(r.querySelector(".s6-p"), { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, at(23.85 + i * 0.06));
            // « offrent gratuitement » : le prix disparaît, remplacé par « Offert »
            tl.to(r.querySelector(".s6-p"), { opacity: 0, duration: 0.2 }, at(25.75 + i * 0.08));
            tl.fromTo(r.querySelector(".s6-g"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at(25.75 + i * 0.08));
          });
          tl.fromTo("#s6-warn", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.5)" }, at(26.2));
          tl.to("#s6-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(26.7));
          window.__timelines["s6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
