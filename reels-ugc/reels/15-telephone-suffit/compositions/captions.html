<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>

      <link rel="stylesheet" href="assets/brand.css" />

      <style>

        .cap-w { position: relative; display: inline-block; margin: 0 6px; font: 600 58px "PxSans", sans-serif; color: #0E1928; padding: 4px 14px; }
        .cap-bg { position: absolute; inset: 0; border-radius: 16px; background: #E6BDC1; opacity: 0; display: block; }
        .cap-t { position: relative; display: inline-block; }
      </style>
      <div id="root" data-composition-id="cap" data-width="1080" data-height="1920">
        <div id="cap-box"></div>
      </div>
      <script>
        (function () {
          const G = [[["Pas", 0.0], ["de", 0.24], ["caméra", 0.32]], [["à", 0.64], ["1 000 € !", 0.8]], [["Ton", 1.44], ["téléphone", 1.68], ["suffit !", 2.08]], [["En", 2.61], ["UGC,", 2.77]], [["les", 3.41], ["marques", 3.57], ["ne", 3.89]], [["veulent", 3.97], ["pas", 4.21], ["un", 4.37]], [["spot", 4.45], ["télé.", 4.77]], [["Elles", 5.25], ["veulent", 5.41], ["du", 5.65], ["vrai,", 5.81]], [["du", 6.29], ["naturel.", 6.45]], [["Une", 7.17], ["vidéo", 7.33], ["qui", 7.65]], [["ressemble", 7.81], ["à", 8.21], ["celle", 8.29]], [["d'une", 8.45], ["amie", 8.69], ["qui", 9.09]], [["te", 9.17], ["recommande", 9.33]], [["un", 9.73], ["produit.", 9.81]], [["Ce", 10.21], ["qui", 10.37], ["fait", 10.53]], [["la", 10.77], ["différence,", 10.85]], [["ce n'est", 11.41], ["pas", 11.65]], [["le", 11.81], ["matériel.", 11.89]], [["C'est", 12.53], ["la", 12.77], ["lumière,", 12.93]], [["le", 13.49], ["son,", 13.65]], [["le", 14.05], ["cadrage", 14.21], ["et", 14.93]], [["surtout", 15.17], ["l'histoire", 15.57], ["que", 16.13]], [["tu", 16.29], ["racontes.", 16.45]], [["Une", 17.01], ["fenêtre", 17.17], ["bien", 17.65]], [["placée", 17.81], ["peut", 18.29], ["faire", 18.45]], [["plus", 18.69], ["qu'un", 18.85], ["projecteur.", 19.09]], [["Et", 19.73], ["il", 19.89], ["y", 20.05]], [["a", 20.13], ["trois", 20.21], ["réglages", 20.45]], [["sur", 21.01], ["ton", 21.09], ["téléphone", 21.25]], [["que", 21.65], ["presque", 21.89], ["personne", 22.29]], [["ne", 22.61], ["touche.", 22.77]], [["Nos", 23.41], ["astuces", 23.65], ["de", 24.13]], [["tournage", 24.21], ["pour", 24.69], ["des", 24.77]], [["vidéos", 24.85], ["qui", 25.09], ["donnent", 25.33]], [["envie", 25.57], ["d'acheter,", 25.81]], [["lien", 26.37], ["en", 26.77], ["bio.", 26.85]]];
          const END = 28.7;
          const box = document.querySelector("#cap-box");
          const tl = gsap.timeline({ paused: true });
          G.forEach((g, gi) => {
            const el = document.createElement("div");
            el.className = "cap-g";
            el.id = "cap-g" + gi;
            g.forEach((w, wi) => {
              const s = document.createElement("span");
              s.className = "cap-w";
              s.innerHTML = '<span class="cap-bg"></span><span class="cap-t"></span>';
              s.querySelector(".cap-t").textContent = w[0];
              el.appendChild(s);
            });
            box.appendChild(el);
            const t0 = Math.max(0, g[0][1] - 0.06);
            const t1 = gi + 1 < G.length ? Math.max(t0 + 0.2, G[gi + 1][0][1] - 0.06) : END;
            tl.fromTo(el, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.14, ease: "power2.out" }, t0);
            if (gi + 1 < G.length) tl.to(el, { opacity: 0, duration: 0.06 }, t1 - 0.06);
            const words = el.querySelectorAll(".cap-w");
            g.forEach((w, wi) => {
              const bg = words[wi].querySelector(".cap-bg");
              const wEnd = wi + 1 < g.length ? g[wi + 1][1] : t1;
              tl.fromTo(bg, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.1, ease: "back.out(2)" }, Math.max(t0, w[1] - 0.03));
              if (wi + 1 < g.length) tl.to(bg, { opacity: 0, duration: 0.08 }, Math.max(t0 + 0.05, wEnd - 0.03));
            });
          });
          window.__timelines["cap"] = tl;
        })();

    </template>
  </body>
</html>
