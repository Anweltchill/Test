<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s6-cam { position: absolute; inset: 0; }
        #s6-dark { position: absolute; left: 50px; right: 50px; top: 240px; height: 1090px; border-radius: 48px; background: #0E1928; opacity: 0; display: block; }
        #s6-l1 { position: absolute; left: 64px; right: 120px; top: 300px; text-align: center; font-size: 40px; color: #E6BDC1; display: block; }
        #s6-l2 { position: absolute; left: 64px; right: 120px; top: 360px; text-align: center; font-size: 96px; color: #FDF4ED; display: block; white-space: nowrap; }
        #s6-ph { position: absolute; left: 282px; top: 520px; width: 460px; height: 740px; border-radius: 56px; background: #172742; border: 12px solid #2A3A5A; display: block; }
        #s6-hd { position: absolute; left: 36px; top: 40px; display: flex; align-items: center; gap: 14px; font: 600 34px "PxSans", sans-serif; color: #FDF4ED; }
        #s6-gear { width: 60px; height: 60px; }
        .s6-r { position: absolute; left: 30px; right: 30px; height: 120px; border-radius: 24px; background: #22324F; display: flex; align-items: center; gap: 16px; padding: 0 22px; }
        .s6-bl { flex: 1; height: 20px; border-radius: 10px; background: #8F9AC3; filter: blur(6px); display: block; }
        .s6-sw { width: 84px; height: 46px; border-radius: 23px; background: #3A4A6A; position: relative; display: block; flex: none; }
        .s6-k { position: absolute; left: 5px; top: 5px; width: 36px; height: 36px; border-radius: 50%; background: #FDF4ED; display: block; }
        .s6-lk { width: 56px; height: 56px; flex: none; }
      </style>
      <div id="root" data-composition-id="s6" data-width="1080" data-height="1920">
        <div id="s6-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s6-dark"></div>
          <span id="s6-l1" class="t-label">Presque personne n'y touche</span>
          <span id="s6-l2" class="t-serif"><span class="acc">3</span> réglages</span>
          <div id="s6-ph">
            <div id="s6-hd"><img id="s6-gear" class="img3d" src="assets/lib/emoji/gear.png" alt="" />Réglages caméra</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 19.6, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // chuchoté : « trois réglages » 20.21–20.45 · « téléphone » 21.25 · « personne ne touche » 22.29–22.77
          tl.fromTo("#s6-dark", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0);
          tl.fromTo("#s6-l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at(20.1));
          tl.fromTo("#s6-ph", { y: 500, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, at(20.9));
          tl.fromTo("#s6-gear", { rotation: 0 }, { rotation: 180, duration: 1.6, ease: "none" }, at(21.1));
          const ph = document.querySelector("#s6-ph");
          [0, 1, 2].forEach((i) => {
            const r = document.createElement("div"); r.className = "s6-r"; r.style.top = 150 + i * 150 + "px";
            r.innerHTML = '<span class="s6-bl"></span><span class="s6-sw"><span class="s6-k"></span></span><img class="s6-lk img3d" src="assets/lib/emoji/locked.png" alt="" />';
            ph.appendChild(r);
            tl.fromTo(r, { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, at(21.3 + i * 0.15));
            tl.fromTo(r.querySelector(".s6-k"), { x: 0 }, { x: 10, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, at(21.9 + i * 0.1));
          });
          tl.fromTo("#s6-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4 }, at(22.2));
          tl.to("#s6-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(23.1));
          window.__timelines["s6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
