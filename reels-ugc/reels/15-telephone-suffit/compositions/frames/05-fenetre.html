<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s5-cam { position: absolute; inset: 0; }
        #s5-room { position: absolute; left: 112px; top: 300px; width: 800px; height: 700px; border-radius: 40px; background: #172742; overflow: hidden; display: block; }
        #s5-win { position: absolute; left: 60px; top: 70px; width: 260px; height: 340px; border-radius: 18px; background: linear-gradient(180deg, #FDF4ED, #E6BDC1); border: 10px solid #FDF4ED; display: block; }
        #s5-win::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 8px; margin-left: -4px; background: #FDF4ED; }
        #s5-win::after { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 8px; margin-top: -4px; background: #FDF4ED; }
        #s5-ray { position: absolute; left: 180px; top: 120px; width: 680px; height: 640px; background: linear-gradient(115deg, rgba(253, 244, 237, 0.75), rgba(253, 244, 237, 0)); clip-path: polygon(0 0, 30% 0, 100% 70%, 100% 100%, 50% 100%); opacity: 0; display: block; }
        #s5-meW { position: absolute; left: 470px; top: 330px; width: 260px; height: 260px; display: block; }
        #s5-me { width: 260px; height: 260px; filter: brightness(0.45); }
        #s5-sun { position: absolute; left: 130px; top: 130px; width: 120px; height: 120px; opacity: 0; }
        #s5-pj { position: absolute; left: 112px; top: 1060px; width: 800px; height: 200px; display: flex; align-items: center; gap: 26px; padding: 0 36px; }
        #s5-pji { width: 130px; height: 130px; flex: none; }
        #s5-pjt { font-size: 52px; display: block; flex: 1; }
      </style>
      <div id="root" data-composition-id="s5" data-width="1080" data-height="1920">
        <div id="s5-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s5-room">
            <div id="s5-win"></div>
            <img id="s5-sun" class="img3d" src="assets/lib/emoji/sun.png" alt="" />
            <div id="s5-ray"></div>
            <div id="s5-meW"><img id="s5-me" class="img3d" src="assets/lib/emoji/selfie.png" alt="" /></div>
          </div>
          <div id="s5-pj" class="card"><img id="s5-pji" class="img3d" src="assets/lib/emoji/window.png" alt="" /><span id="s5-pjt" class="t-serif">Mieux qu'un <span class="acc">projecteur</span></span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 16.95, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « fenêtre » 17.17 · « bien placée » 17.65–17.81 · « projecteur » 19.09
          tl.fromTo("#s5-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s5-room", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, at(17.0));
          tl.fromTo("#s5-win", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.4, ease: "back.out(2)" }, at(17.15));
          // la lumière entre et éclaire la créatrice
          tl.fromTo("#s5-sun", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(3)" }, at(17.6));
          tl.fromTo("#s5-ray", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, at(17.75));
          tl.fromTo("#s5-me", { filter: "brightness(0.45)" }, { filter: "brightness(1)", duration: 0.5, ease: "power2.out" }, at(17.8));
          PX.burst(tl, "#s5-cam", 712, 770, at(18.1), { n: 14, r: 240, seed: 57 });
          tl.fromTo("#s5-pj", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, at(18.6));
          tl.fromTo("#s5-pji", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, at(18.75));
          tl.to("#s5-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(19.4));
          window.__timelines["s5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
