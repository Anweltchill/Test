<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s4-cam { position: absolute; inset: 0; }
        #s4-l1 { position: absolute; left: 64px; right: 120px; top: 280px; text-align: center; font-size: 40px; display: block; }
        #s4-l2 { position: absolute; left: 64px; right: 120px; top: 330px; text-align: center; font-size: 84px; display: block; white-space: nowrap; }
        #s4-l2s { position: absolute; left: -6px; right: -6px; top: 50%; height: 10px; margin-top: -5px; border-radius: 5px; background: #E2718D; display: block; transform-origin: 0% 50%; }
        #s4-l2w { position: relative; display: inline-block; }
        .s4-g { position: absolute; left: 112px; width: 800px; height: 130px; display: flex; align-items: center; gap: 24px; padding: 0 30px; }
        #s4-g1 { top: 480px; }
        #s4-g2 { top: 630px; }
        #s4-g3 { top: 780px; }
        .s4-gi { width: 90px; height: 90px; flex: none; }
        .s4-gt { font-size: 46px; width: 220px; display: block; flex: none; }
        .s4-tr { flex: 1; height: 26px; border-radius: 13px; background: #F0E6DD; overflow: hidden; display: block; }
        .s4-fl { width: 100%; height: 100%; background: linear-gradient(90deg, #DB96A1, #E2718D); display: block; transform-origin: 0% 50%; }
        #s4-st { position: absolute; left: 112px; top: 950px; width: 800px; height: 280px; display: flex; align-items: center; gap: 30px; padding: 0 40px; background: #0E1928; border-radius: 40px; }
        #s4-sti { width: 170px; height: 170px; flex: none; }
        #s4-stt { font-size: 66px; color: #FDF4ED; line-height: 1.05; display: block; }
      </style>
      <div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
        <div id="s4-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s4-l1" class="t-label">Ce qui fait la différence ?</span>
          <span id="s4-l2" class="t-serif"><span id="s4-l2w">Pas le matériel<span id="s4-l2s"></span></span></span>
          <div id="s4-g1" class="s4-g card"><img class="s4-gi img3d" src="assets/lib/emoji/light-bulb.png" alt="" /><span class="s4-gt t-serif">Lumière</span><span class="s4-tr"><span class="s4-fl"></span></span></div>
          <div id="s4-g2" class="s4-g card"><img class="s4-gi img3d" src="assets/lib/emoji/studio-microphone.png" alt="" /><span class="s4-gt t-serif">Son</span><span class="s4-tr"><span class="s4-fl"></span></span></div>
          <div id="s4-g3" class="s4-g card"><img class="s4-gi img3d" src="assets/lib/emoji/framed-picture.png" alt="" /><span class="s4-gt t-serif">Cadrage</span><span class="s4-tr"><span class="s4-fl"></span></span></div>
          <div id="s4-st"><img id="s4-sti" class="img3d" src="assets/lib/emoji/open-book.png" alt="" /><span id="s4-stt" class="t-serif">Et surtout… <span class="acc">l'histoire</span></span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 10.2, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « différence » 10.85 · « matériel » 11.89 · « lumière » 12.93 · « son » 13.65 · « cadrage » 14.21 · « surtout l'histoire » 15.17–15.57 · « racontes » 16.45
          tl.fromTo("#s4-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s4-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3 }, at(10.4));
          tl.fromTo("#s4-l2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at(11.3));
          tl.fromTo("#s4-l2s", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, at(12.0));
          [["#s4-g1", 12.8], ["#s4-g2", 13.5], ["#s4-g3", 14.05]].forEach(([g, t], i) => {
            tl.fromTo(g, { x: i % 2 ? 900 : -900 }, { x: 0, duration: 0.4, ease: "back.out(1.4)" }, at(t));
            tl.fromTo(g + " .s4-gi", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, at(t + 0.1));
            tl.fromTo(g + " .s4-fl", { scaleX: 0 }, { scaleX: [0.85, 0.75, 0.9][i], duration: 0.6, ease: "power2.out" }, at(t + 0.25));
          });
          tl.fromTo("#s4-st", { y: 300, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, at(15.05));
          tl.fromTo("#s4-sti", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, at(15.4));
          PX.burst(tl, "#s4-cam", 512, 1090, at(15.6), { n: 18, r: 420, seed: 46 });
          tl.fromTo("#s4-st", { scale: 1 }, { scale: 1.04, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at(16.4));
          tl.to("#s4-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(16.75));
          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
