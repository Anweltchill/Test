<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s1-cam { position: absolute; inset: 0; }
        #s1-n { position: absolute; left: 64px; right: 120px; top: 250px; text-align: center; font-size: 360px; line-height: 1; color: #E2718D; display: block; }
        #s1-l1 { position: absolute; left: 64px; right: 120px; top: 640px; text-align: center; font-size: 100px; display: block; white-space: nowrap; }
        #s1-l2 { position: absolute; left: 64px; right: 120px; top: 770px; text-align: center; font-size: 60px; display: block; white-space: nowrap; }
        #s1-brw { position: absolute; left: 432px; top: 940px; width: 160px; height: 160px; border-radius: 50%; background: #FDF4ED; box-shadow: 0 16px 40px rgba(14, 25, 40, 0.14); display: flex; align-items: center; justify-content: center; }
        #s1-br { width: 100px; height: 100px; }
        #s1-run { position: absolute; left: 600px; top: 960px; width: 130px; height: 130px; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div id="s1-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s1-n" class="t-serif">5</span>
          <span id="s1-l1" class="t-serif"><span class="acc">erreurs</span></span>
          <span id="s1-l2" class="t-serif">qui font fuir les marques</span>
          <div id="s1-brw"><img id="s1-br" class="img3d" src="assets/lib/emoji/shopping-bags.png" alt="" /></div>
          <img id="s1-run" class="img3d" src="assets/lib/emoji/dashing-away.png" alt="" />
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // « Cinq » 0.05 · « erreurs » 0.32 · « fuir » 1.12 · « marques » 1.60
          tl.fromTo("#s1-n", { scale: 3, opacity: 0, rotation: -20 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.3, ease: "power4.in" }, 0.0);
          PX.burst(tl, "#s1-cam", 512, 430, 0.3, { n: 18, r: 380, seed: 14 });
          PX.letters(tl, "#s1-l1", 0.3, { y: 90, stagger: 0.035, dur: 0.35 });
          tl.fromTo("#s1-l2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.85);
          tl.fromTo("#s1-br", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.95);
          // la marque s'enfuit
          tl.to("#s1-brw", { x: 700, rotation: 25, duration: 0.5, ease: "power3.in" }, 1.25);
          tl.fromTo("#s1-run", { opacity: 0, x: 0 }, { opacity: 1, x: 120, duration: 0.3, ease: "power2.out" }, 1.3);
          tl.to("#s1-run", { opacity: 0, duration: 0.2 }, 1.6);
          tl.to("#s1-cam", { x: -1080, filter: "blur(16px)", duration: 0.18, ease: "power3.in" }, 1.82);
          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
