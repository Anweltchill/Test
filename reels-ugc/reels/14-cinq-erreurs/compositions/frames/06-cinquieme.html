<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s6-cam { position: absolute; inset: 0; }
        #s6-dark { position: absolute; left: 50px; right: 50px; top: 240px; height: 1090px; border-radius: 48px; background: #0E1928; opacity: 0; display: block; }
        #s6-num { position: absolute; left: 437px; top: 300px; width: 150px; height: 150px; border-radius: 50%; background: #E2718D; color: #FDF4ED; font-size: 96px; display: flex; align-items: center; justify-content: center; }
        #s6-l1 { position: absolute; left: 64px; right: 120px; top: 480px; text-align: center; font-size: 66px; color: #FDF4ED; display: block; white-space: nowrap; }
        #s6-stage { position: absolute; left: 152px; top: 610px; width: 720px; height: 520px; border-radius: 26px; background: #172742; overflow: hidden; display: block; }
        #s6-q { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-size: 200px; color: #E6BDC1; display: block; }
        #s6-cur { position: absolute; left: 0; right: 0; top: 0; height: 520px; background: repeating-linear-gradient(90deg, #CC7183 0 60px, #B65A70 60px 72px); transform-origin: 50% 0%; display: block; }
        #s6-rod { position: absolute; left: 132px; top: 590px; width: 760px; height: 28px; border-radius: 14px; background: #DB96A1; display: block; }
        #s6-sh { position: absolute; left: 452px; top: 1150px; width: 120px; height: 120px; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s6" data-width="1080" data-height="1920">
        <div id="s6-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s6-dark"></div>
          <div id="s6-num" class="t-serif">5</div>
          <span id="s6-l1" class="t-serif">La plus <span class="acc">fréquente</span>…</span>
          <div id="s6-stage"><span id="s6-q" class="t-serif">?</span><div id="s6-cur"></div></div>
          <div id="s6-rod"></div>
          <img id="s6-sh" class="img3d" src="assets/lib/emoji/shushing-face.png" alt="" />
        </div>
      </div>
      <script>
        (function () {
          const T0 = 15.5, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // chuchoté : « la cinquième » 15.70–15.94 · « plus fréquente » 16.90–17.06 · « on ne s'en rend même pas compte » 18.18–19.14
          tl.fromTo("#s6-dark", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0);
          tl.fromTo("#s6-num", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.5)" }, at(15.8));
          tl.fromTo("#s6-l1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at(16.8));
          tl.fromTo(["#s6-stage", "#s6-rod"], { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at(15.95));
          // le rideau essaie de s'ouvrir… et retombe
          tl.fromTo("#s6-cur", { scaleY: 1 }, { scaleY: 0.82, duration: 0.45, ease: "power2.out", immediateRender: false }, at(17.6));
          tl.to("#s6-cur", { scaleY: 1, duration: 0.5, ease: "bounce.out" }, at(18.1));
          tl.fromTo("#s6-cur", { scaleY: 1 }, { scaleY: 0.9, duration: 0.3, ease: "power2.out", immediateRender: false }, at(18.75));
          tl.to("#s6-cur", { scaleY: 1, duration: 0.4, ease: "bounce.out" }, at(19.05));
          tl.fromTo("#s6-sh", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at(18.3));
          tl.to("#s6-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(19.3));
          window.__timelines["s6"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
