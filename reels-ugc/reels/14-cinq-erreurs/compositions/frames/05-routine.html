<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s5-cam { position: absolute; inset: 0; }
        #s5-num { position: absolute; left: 112px; top: 290px; width: 150px; height: 150px; border-radius: 50%; background: #E2718D; color: #FDF4ED; font-size: 96px; display: flex; align-items: center; justify-content: center; }
        #s5-tw { position: absolute; left: 290px; right: 120px; top: 290px; height: 150px; display: flex; align-items: center; }
        #s5-t { position: relative; font-size: 46px; line-height: 1.1; display: block; white-space: nowrap; }
        #s5-st { position: absolute; left: -6px; right: -6px; top: 50%; height: 10px; margin-top: -5px; border-radius: 5px; background: #E2718D; display: block; transform-origin: 0% 50%; }
        #s5-x { position: absolute; left: 820px; top: 270px; width: 100px; height: 100px; opacity: 0; }
        .s5-v { position: absolute; top: 540px; width: 240px; height: 330px; border-radius: 26px; background: #E6BDC1; display: flex; align-items: center; justify-content: center; }
        .s5-vi { width: 120px; height: 120px; }
        #s5-rep { position: absolute; left: 452px; top: 900px; width: 120px; height: 120px; }
        .s5-n { position: absolute; top: 1060px; height: 110px; border-radius: 26px; border: 4px dashed #DB96A1; background: rgba(253, 244, 237, 0.7); display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 26px; font: 600 34px "PxSans", sans-serif; color: #5E5A57; white-space: nowrap; }
        .s5-lk { width: 56px; height: 56px; }
      </style>
      <div id="root" data-composition-id="s5" data-width="1080" data-height="1920">
        <div id="s5-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s5-num" class="t-serif">4</div>
          <div id="s5-tw"><span id="s5-t" class="t-serif">Toujours le <span class="acc">même</span> format<span id="s5-st"></span></span></div>
          <img id="s5-x" class="img3d" src="assets/lib/emoji/cross-mark.png" alt="" />
          <div class="s5-v" style="left:122px"><img class="s5-vi img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /></div>
          <div class="s5-v" style="left:392px"><img class="s5-vi img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /></div>
          <div class="s5-v" style="left:662px"><img class="s5-vi img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /></div>
          <img id="s5-rep" class="img3d" src="assets/lib/emoji/repeat-button.png" alt="" />
          <div class="s5-n" style="left:112px"><img class="s5-lk img3d" src="assets/lib/emoji/locked.png" alt="" />Unboxing</div>
          <div class="s5-n" style="left:400px"><img class="s5-lk img3d" src="assets/lib/emoji/locked.png" alt="" />Tuto</div>
          <div class="s5-n" style="left:620px"><img class="s5-lk img3d" src="assets/lib/emoji/locked.png" alt="" />Avant/après</div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 11.8, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s5-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s5-num", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.5)" }, at(11.85));
          tl.fromTo("#s5-t", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, at(12.3));
          tl.fromTo("#s5-st", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, at(15.05));
          tl.fromTo("#s5-x", { opacity: 0, scale: 2.4, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: "power4.in" }, at(15.05 + 0.1));
          tl.fromTo(".s5-v", { y: 400, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.6)", stagger: 0.12 }, at(12.3));
          tl.fromTo("#s5-rep", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(13.1));
          tl.fromTo("#s5-rep", { rotation: 0 }, { rotation: 720, duration: 1.4, ease: "none", immediateRender: false }, at(13.3));
          tl.fromTo(".s5-n", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.5)", stagger: 0.1 }, at(14.3));
          tl.fromTo(".s5-lk", { rotation: -20 }, { rotation: 20, duration: 0.1, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, at(14.8));
          tl.to("#s5-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(15.3));
          window.__timelines["s5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
