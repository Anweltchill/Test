<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s4-cam { position: absolute; inset: 0; }
        #s4-num { position: absolute; left: 112px; top: 290px; width: 150px; height: 150px; border-radius: 50%; background: #E2718D; color: #FDF4ED; font-size: 96px; display: flex; align-items: center; justify-content: center; }
        #s4-tw { position: absolute; left: 290px; right: 120px; top: 290px; height: 150px; display: flex; align-items: center; }
        #s4-t { position: relative; font-size: 46px; line-height: 1.1; display: block; white-space: nowrap; }
        #s4-st { position: absolute; left: -6px; right: -6px; top: 50%; height: 10px; margin-top: -5px; border-radius: 5px; background: #E2718D; display: block; transform-origin: 0% 50%; }
        #s4-x { position: absolute; left: 820px; top: 270px; width: 100px; height: 100px; opacity: 0; }
        #s4-msg { position: absolute; left: 212px; top: 560px; width: 600px; height: 200px; border-radius: 34px 34px 8px 34px; background: linear-gradient(135deg, #E2718D, #CC7183); display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 0 40px; }
        .s4-l { height: 20px; border-radius: 10px; background: rgba(253, 244, 237, 0.6); display: block; }
        .s4-cp { position: absolute; left: 212px; top: 560px; width: 600px; height: 200px; border-radius: 34px 34px 8px 34px; background: #DB96A1; opacity: 0; display: block; }
        #s4-cnt { position: absolute; left: 0; right: 56px; top: 1060px; text-align: center; display: block; }
        #s4-cb { display: inline-flex; align-items: center; gap: 16px; background: #0E1928; color: #FDF4ED; border-radius: 999px; padding: 12px 40px 12px 16px; font: 600 48px "PxSans", sans-serif; }
        #s4-ci { width: 80px; height: 80px; }
      </style>
      <div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
        <div id="s4-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s4-num" class="t-serif">3</div>
          <div id="s4-tw"><span id="s4-t" class="t-serif">Le message <span class="acc">copié-collé</span><span id="s4-st"></span></span></div>
          <img id="s4-x" class="img3d" src="assets/lib/emoji/cross-mark.png" alt="" />
          <div id="s4-msg"><span class="s4-l" style="width:90%"></span><span class="s4-l" style="width:70%"></span><span class="s4-l" style="width:80%"></span></div>
          <div id="s4-cnt"><span id="s4-cb"><img id="s4-ci" class="img3d" src="assets/lib/emoji/envelope-with-arrow.png" alt="" /><span id="s4-cn">× 1</span> marques</span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 8.4, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s4-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#s4-num", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.5)" }, at(8.45));
          tl.fromTo("#s4-t", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, at(9.0));
          tl.fromTo("#s4-st", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, at(11.3));
          tl.fromTo("#s4-x", { opacity: 0, scale: 2.4, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: "power4.in" }, at(11.3 + 0.1));
          tl.fromTo("#s4-msg", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, at(9.0));
          // copies qui s'empilent
          const cam = document.querySelector("#s4-cam");
          for (let i = 0; i < 8; i++) {
            const c = document.createElement("div"); c.className = "s4-cp"; cam.insertBefore(c, document.querySelector("#s4-msg"));
            tl.fromTo(c, { opacity: 0, x: 0, y: 0, rotation: 0 }, { opacity: 0.9 - i * 0.08, x: (i % 2 ? 1 : -1) * (30 + i * 18), y: 40 + i * 32, rotation: (i % 2 ? 1 : -1) * (3 + i), duration: 0.25, ease: "power2.out" }, at(9.4 + i * 0.07));
          }
          tl.fromTo("#s4-cnt", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, at(10.3));
          const n = document.querySelector("#s4-cn");
          const c = { _v: 1, get v() { return this._v; }, set v(x) { this._v = x; n.textContent = "× " + Math.round(x); } };
          tl.fromTo(c, { v: 1 }, { v: 100, duration: 0.8, ease: "power2.out" }, at(10.45));
          tl.to("#s4-cam", { x: -1080, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, at(11.6));
          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
