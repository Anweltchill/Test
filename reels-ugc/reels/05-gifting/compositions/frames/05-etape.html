<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s5-cam { position: absolute; inset: 0; }
        #s5-l1 { position: absolute; left: 64px; right: 120px; top: 270px; text-align: center; font-size: 36px; white-space: nowrap; display: block; }
        #s5-l2 { position: absolute; left: 64px; right: 120px; top: 340px; text-align: center; font-size: 96px; display: block; white-space: nowrap; }
        .s5-step { position: absolute; bottom: 640px; width: 270px; border-radius: 26px 26px 0 0; display: block; }
        #s5-st1 { left: 82px; height: 220px; background: #E6BDC1; }
        #s5-st2 { left: 372px; height: 400px; background: #DB96A1; }
        #s5-st3 { left: 662px; height: 580px; background: #0E1928; }
        .s5-g { position: absolute; width: 120px; height: 120px; }
        #s5-g1 { left: 92px; top: 945px; }
        #s5-g2 { left: 382px; top: 765px; }
        .s5-ck { position: absolute; width: 70px; height: 70px; }
        #s5-ck1 { left: 170px; top: 925px; }
        #s5-ck2 { left: 460px; top: 745px; }
        #s5-bagw { position: absolute; left: 707px; top: 540px; width: 180px; height: 180px; display: block; }
        #s5-bag { width: 180px; height: 180px; }
        #s5-neg { position: absolute; left: 672px; top: 760px; width: 250px; text-align: center; font-size: 48px; color: #FDF4ED; line-height: 1.1; display: block; }
        #s5-runw { position: absolute; left: 60px; top: 1150px; width: 130px; height: 130px; display: block; }
        #s5-run { width: 130px; height: 130px; }
        #s5-pt { position: absolute; left: 64px; right: 120px; top: 1110px; text-align: center; display: block; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s5" data-width="1080" data-height="1920">
        <div id="s5-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <span id="s5-l1" class="t-label">Après quelques collaborations</span>
          <span id="s5-l2" class="t-serif">l'étape <span class="acc">suivante</span></span>
          <div id="s5-st1" class="s5-step"></div>
          <div id="s5-st2" class="s5-step"></div>
          <div id="s5-st3" class="s5-step"></div>
          <img id="s5-g1" class="s5-g img3d" src="assets/lib/emoji/wrapped-gift.png" alt="" />
          <img id="s5-g2" class="s5-g img3d" src="assets/lib/emoji/wrapped-gift.png" alt="" />
          <img id="s5-ck1" class="s5-ck" src="assets/lib/emoji/check-mark-button.png" alt="" />
          <img id="s5-ck2" class="s5-ck" src="assets/lib/emoji/check-mark-button.png" alt="" />
          <div id="s5-bagw"><img id="s5-bag" class="img3d" src="assets/lib/emoji/money-bag.png" alt="" /></div>
          <span id="s5-neg" class="t-serif">Négocier tes premiers tarifs</span>
          <div id="s5-runw"><img id="s5-run" class="img3d" src="assets/lib/emoji/woman-running.png" alt="" /></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 17.1, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « quelques collaborations » 17.78–18.10 · « tout ce qu'il faut » 19.62 · « étape suivante » 20.74–21.14 · « négocier » 21.78 · « tarifs » 22.90
          tl.fromTo("#s5-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, 0);
          tl.fromTo("#s5-l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4 }, at(17.4));
          ["#s5-st1", "#s5-st2", "#s5-st3"].forEach((s, i) => tl.fromTo(s, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.5, ease: "back.out(1.6)" }, at(17.5 + i * 0.15)));
          tl.fromTo("#s5-g1", { y: -600, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "bounce.out" }, at(17.95));
          tl.fromTo("#s5-g2", { y: -600, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "bounce.out" }, at(18.25));
          tl.fromTo("#s5-ck1", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(18.5));
          tl.fromTo("#s5-ck2", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(18.8));
          tl.fromTo("#s5-run", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, at(19.0));
          // la créatrice grimpe les marches
          tl.fromTo("#s5-runw", { x: 0, y: 0 }, { x: 150, y: -220, duration: 0.6, ease: "power2.inOut" }, at(19.6));
          tl.to("#s5-runw", { x: 440, y: -400, duration: 0.6, ease: "power2.inOut" }, at(20.4));
          tl.fromTo("#s5-l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power4.out" }, at(20.6));
          tl.fromTo("#s5-neg", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45 }, at(21.6));
          tl.fromTo("#s5-bag", { scale: 0, rotation: -40, y: 80 }, { scale: 1, rotation: 0, y: 0, duration: 0.5, ease: "back.out(3)" }, at(22.6));
          tl.to("#s5-runw", { y: -460, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, at(22.6));
          PX.burst(tl, "#s5-cam", 797, 630, at(22.85), { n: 18, r: 340, seed: 57 });
          PX.float(tl, "#s5-bagw", at(23.1), 0.3, 6, 0.3, 4);
          tl.to("#s5-cam", { scale: 1.4, opacity: 0, filter: "blur(14px)", duration: 0.22, ease: "power3.in" }, at(23.18));
          window.__timelines["s5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
