<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s1-cam { position: absolute; inset: 0; }
        #s1-l1 { position: absolute; left: 64px; right: 120px; top: 270px; text-align: center; font-size: 56px; display: block; }
        #s1-l2 { position: absolute; left: 64px; right: 120px; top: 340px; text-align: center; font-size: 112px; display: block; white-space: nowrap; }
        #s1-giftw { position: absolute; left: 312px; top: 540px; width: 400px; height: 400px; display: block; }
        #s1-gift { width: 400px; height: 400px; }
        #s1-tagw { position: absolute; left: 640px; top: 560px; width: 250px; height: 150px; transform-origin: 20px 20px; display: block; }
        #s1-tag { width: 250px; height: 130px; border-radius: 18px 60px 60px 18px; background: #0E1928; color: #FDF4ED; display: flex; align-items: center; justify-content: center; font: 700 74px "PxSerif", serif; }
        #s1-tag::before { content: ""; position: absolute; left: 18px; top: 52px; width: 22px; height: 22px; border-radius: 50%; background: #FDF4ED; }
        #s1-free { position: absolute; left: 64px; right: 120px; top: 1010px; text-align: center; font-size: 110px; display: block; white-space: nowrap; }
        #s1-thinkw { position: absolute; left: 110px; top: 830px; width: 170px; height: 170px; display: block; }
        #s1-think { width: 170px; height: 170px; }
      </style>
      <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div id="s1-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s1-l1" class="t-label">Ta toute première</div>
          <div id="s1-l2" class="t-serif">collaboration</div>
          <div id="s1-giftw"><img id="s1-gift" class="img3d" src="assets/lib/emoji/wrapped-gift.png" alt="" /></div>
          <div id="s1-tagw"><div id="s1-tag">0 €</div></div>
          <div id="s1-thinkw"><img id="s1-think" class="img3d" src="assets/lib/emoji/thinking-face.png" alt="" /></div>
          <div id="s1-free" class="t-italic">gratuitement ?</div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // « première » 0.48 · « collaboration » 0.80 · « gratuitement » 2.00
          tl.fromTo("#s1-l1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35 }, 0.0);
          PX.letters(tl, "#s1-l2", 0.55, { y: 90, stagger: 0.025, dur: 0.4 });
          tl.fromTo("#s1-gift", { scale: 0.2, rotation: -30, y: -500 }, { scale: 1, rotation: 0, y: 0, duration: 0.6, ease: "bounce.out" }, 0.05);
          tl.fromTo("#s1-giftw", { scaleX: 1, scaleY: 1 }, { scaleX: 1.08, scaleY: 0.9, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 0.6);
          PX.burst(tl, "#s1-cam", 512, 760, 0.62, { n: 16, r: 340, seed: 5 });
          PX.float(tl, "#s1-giftw", 0.9, 1.8, 10, 1.2, 3);
          tl.fromTo("#s1-tag", { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, 1.75);
          tl.fromTo("#s1-tagw", { rotation: -14 }, { rotation: 14, duration: 0.35, yoyo: true, repeat: 2, ease: "sine.inOut", immediateRender: false }, 2.1);
          tl.fromTo("#s1-free", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power4.out" }, 1.85);
          tl.fromTo("#s1-think", { scale: 0, rotation: 30 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, 2.15);
          tl.to("#s1-cam", { x: -1080, filter: "blur(16px)", duration: 0.24, ease: "power3.in" }, 2.66);
          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
