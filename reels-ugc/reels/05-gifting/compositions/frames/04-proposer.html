<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s4-cam { position: absolute; inset: 0; }
        .s4-lane { position: absolute; left: 72px; width: 880px; height: 420px; display: block; }
        #s4-A { top: 300px; }
        #s4-B { top: 820px; }
        .s4-tag { position: absolute; left: 40px; top: 30px; font-size: 60px; display: block; white-space: nowrap; }
        .s4-me { position: absolute; left: 40px; top: 130px; width: 230px; height: 230px; }
        .s4-to { position: absolute; left: 620px; top: 150px; width: 210px; height: 210px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .s4-lg { width: 96px; height: 96px; }
        .s4-env { position: absolute; left: 270px; top: 170px; width: 150px; height: 150px; }
        .s4-trail { position: absolute; left: 280px; top: 240px; width: 340px; height: 10px; display: block; }
      </style>
      <div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
        <div id="s4-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s4-A" class="s4-lane card">
            <span class="s4-tag t-serif">Tu le <span class="acc">proposes</span></span>
            <img class="s4-me img3d" src="assets/lib/emoji/woman-raising-hand.png" alt="" />
            <svg class="s4-trail" viewBox="0 0 340 10"><line x1="0" y1="5" x2="340" y2="5" stroke="#DB96A1" stroke-width="5" stroke-dasharray="10 12" /></svg>
            <div class="s4-to"><img class="s4-lg logo-app" src="assets/lib/logos/gmail.svg" alt="" /><img class="s4-lg logo-app" src="assets/lib/logos/instagram-icon.svg" alt="" /></div>
            <img id="s4-envA" class="s4-env img3d" src="assets/lib/emoji/envelope-with-arrow.png" alt="" />
          </div>
          <div id="s4-B" class="s4-lane card">
            <span class="s4-tag t-serif">… ou tu l'<span class="acc">acceptes</span></span>
            <img class="s4-me img3d" src="assets/lib/emoji/woman-tipping-hand.png" alt="" />
            <svg class="s4-trail" viewBox="0 0 340 10"><line x1="0" y1="5" x2="340" y2="5" stroke="#DB96A1" stroke-width="5" stroke-dasharray="10 12" /></svg>
            <div class="s4-to"><img class="s4-lg img3d" style="width:180px;height:180px" src="assets/lib/emoji/shopping-bags.png" alt="" /></div>
            <img id="s4-envB" class="s4-env img3d" src="assets/lib/emoji/incoming-envelope.png" alt="" />
          </div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 13.9, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « proposer » 14.56 · « démarches » 15.28 · « accepter » 15.92 · « d'elles » 16.88
          tl.fromTo("#s4-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, 0);
          tl.fromTo("#s4-A", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, at(13.95));
          tl.fromTo("#s4-A .s4-me", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, at(14.1));
          tl.fromTo("#s4-A .s4-lg", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)", stagger: 0.1 }, at(14.4));
          tl.fromTo("#s4-envA", { x: 0, scale: 0, rotation: -20 }, { x: 0, scale: 1, rotation: 0, duration: 0.3, ease: "back.out(3)" }, at(14.5));
          tl.to("#s4-envA", { x: 380, rotation: 15, duration: 0.6, ease: "power2.in" }, at(14.95));
          tl.to("#s4-envA", { scale: 0, opacity: 0, duration: 0.15 }, at(15.5));
          tl.fromTo("#s4-A .s4-to", { scale: 1 }, { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at(15.55));
          tl.fromTo("#s4-B", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, at(15.6));
          tl.fromTo("#s4-B .s4-me", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, at(15.75));
          tl.fromTo("#s4-B .s4-lg", { scale: 0, rotation: 60 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, at(15.85));
          tl.fromTo("#s4-envB", { x: 380, scale: 0 }, { x: 380, scale: 1, duration: 0.25, ease: "back.out(3)" }, at(15.95));
          tl.to("#s4-envB", { x: 0, rotation: -15, duration: 0.45, ease: "power2.in" }, at(16.15));
          tl.fromTo("#s4-B .s4-me", { scale: 1 }, { scale: 1.1, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at(16.6));
          PX.burst(tl, "#s4-cam", 270, 1080, at(16.6), { n: 10, r: 170, size: 16, seed: 44 });
          tl.to("#s4-cam", { y: -500, opacity: 0, filter: "blur(14px)", duration: 0.2, ease: "power3.in" }, at(16.9));
          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
