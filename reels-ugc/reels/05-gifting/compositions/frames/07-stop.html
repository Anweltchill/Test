<!doctype html>

    <template>
      <link rel="stylesheet" href="assets/brand.css" />

      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s7-cam { position: absolute; inset: 0; }
        .s7-c { position: absolute; left: 112px; width: 800px; height: 210px; display: flex; align-items: center; gap: 28px; padding: 0 34px; }
        #s7-c1 { top: 290px; }
        #s7-c2 { top: 540px; }
        #s7-c3 { top: 790px; }

        .s7-t { font-size: 52px; line-height: 1.1; display: block; flex: 1; }

        #s7-pp { font-size: 112px; display: block; white-space: nowrap; margin-top: 6px; }

      <div id="root" data-composition-id="s7" data-width="1080" data-height="1920">
        <div id="s7-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s7-c1" class="s7-c card"><img class="s7-i img3d" src="assets/lib/emoji/stop-sign.png" alt="" /><span class="s7-t t-serif">Quand dire <span class="acc">stop</span></span><img class="s7-lock img3d" src="assets/lib/emoji/locked.png" alt="" /></div>
          <div id="s7-c2" class="s7-c card"><img class="s7-i img3d" src="assets/lib/emoji/label.png" alt="" /><span class="s7-t t-serif">Comment annoncer ton <span class="acc">prix</span></span><img class="s7-lock img3d" src="assets/lib/emoji/locked.png" alt="" /></div>
          <div id="s7-c3" class="s7-c card"><img class="s7-i img3d" src="assets/lib/emoji/woman-running.png" alt="" /><span class="s7-t t-serif">Sans faire <span class="acc">fuir</span> la marque</span><img class="s7-lock img3d" src="assets/lib/emoji/locked.png" alt="" /></div>
          <div id="s7-ex"><span id="s7-ext" class="t-label">C'est ce qu'on t'apprend chez</span><span id="s7-pp" class="t-serif">PHOENIX PRO</span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 26.9, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « stop » 27.86 · « prix » 29.22 · « fuir la marque » 29.78–30.18 · « t'apprend » 30.82 · « Phoenix Pro » 31.38–31.78
          tl.fromTo("#s7-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, 0);
          [["#s7-c1", 27.0], ["#s7-c2", 28.75], ["#s7-c3", 29.55]].forEach(([c, t], i) => {
            tl.fromTo(c, { x: i % 2 ? 900 : -900, rotation: i % 2 ? 4 : -4 }, { x: 0, rotation: 0, duration: 0.5, ease: "back.out(1.4)" }, at(t));
            tl.fromTo(c + " .s7-i", { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, at(t + 0.1));
            tl.fromTo(c + " .s7-lock", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, at(t + 0.35));
          });
          tl.fromTo("#s7-c1 .s7-i", { scale: 1 }, { scale: 1.2, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at(27.85));
          tl.fromTo("#s7-c3 .s7-i", { x: 0 }, { x: -40, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, at(29.9));
          tl.fromTo("#s7-ext", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4 }, at(30.6));
          PX.letters(tl, "#s7-pp", at(31.2), { y: 100, stagger: 0.035 }).slice(8).forEach((c) => (c.style.color = "#E2718D"));
          PX.burst(tl, "#s7-cam", 512, 1180, at(31.45), { n: 18, r: 380, seed: 71 });
          tl.to("#s7-cam", { y: -500, opacity: 0, filter: "blur(14px)", duration: 0.22, ease: "power3.in" }, at(31.7));
          window.__timelines["s7"] = tl;
        })();
      </script>
    </template>
