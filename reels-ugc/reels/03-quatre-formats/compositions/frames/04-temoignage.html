<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s4-cam { position: absolute; inset: 0; }
        #s4-head { position: absolute; left: 90px; top: 280px; display: flex; align-items: center; gap: 28px; }
        #s4-num { width: 140px; height: 140px; border-radius: 50%; background: #E2718D; color: #FDF4ED; display: flex; align-items: center; justify-content: center; font: 700 72px "PxSerif", serif; flex: none; }
        #s4-title { font-size: 86px; display: block; white-space: nowrap; }
        #s4-rev { position: absolute; left: 112px; top: 500px; width: 800px; height: 720px; display: block; }
        #s4-av { position: absolute; left: 44px; top: 44px; width: 150px; height: 150px; border-radius: 50%; background: #E6BDC1; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
        #s4-avi { width: 130px; height: 130px; }
        #s4-name { position: absolute; left: 220px; top: 60px; font-size: 48px; display: block; }
        #s4-sub { position: absolute; left: 220px; top: 130px; font-size: 28px; color: #CC7183; display: block; }
        #s4-stars { position: absolute; left: 44px; top: 240px; display: flex; gap: 14px; }
        .s4-st { width: 92px; height: 92px; }
        #s4-l1 { position: absolute; left: 44px; top: 360px; font-size: 30px; color: #CC7183; display: block; }
        #s4-quote { position: absolute; left: 44px; right: 44px; top: 410px; font-size: 52px; line-height: 1.25; display: block; min-height: 140px; }
        #s4-rec { position: absolute; left: 44px; top: 600px; display: flex; align-items: center; gap: 16px; background: #0E1928; color: #FDF4ED; border-radius: 999px; padding: 14px 36px 14px 18px; font: 600 42px "PxSans", sans-serif; }
        #s4-th { width: 76px; height: 76px; }
        #s4-bubw { position: absolute; left: 760px; top: 420px; width: 200px; height: 200px; display: block; }
        #s4-bub { width: 200px; height: 200px; }
      </style>
      <div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
        <div id="s4-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s4-head"><span id="s4-num">3</span><span id="s4-title" class="t-serif">Le <span class="acc">témoignage</span></span></div>
          <div id="s4-rev" class="card">
            <div id="s4-av"><img id="s4-avi" src="assets/lib/emoji/woman-raising-hand.png" alt="" /></div>
            <span id="s4-name" class="t-serif">Ton avis</span>
            <span id="s4-sub" class="t-label">Exemple de format</span>
            <div id="s4-stars"><img class="s4-st" src="assets/lib/emoji/star.png" alt="" /><img class="s4-st" src="assets/lib/emoji/star.png" alt="" /><img class="s4-st" src="assets/lib/emoji/star.png" alt="" /><img class="s4-st" src="assets/lib/emoji/star.png" alt="" /><img class="s4-st" src="assets/lib/emoji/star.png" alt="" /></div>
            <span id="s4-l1" class="t-label">Retour d'expérience</span>
            <span id="s4-quote" class="t-italic"></span>
            <div id="s4-rec"><img id="s4-th" src="assets/lib/emoji/thumbs-up.png" alt="" />Je recommande</div>
          </div>
          <div id="s4-bubw"><img id="s4-bub" class="img3d" src="assets/lib/emoji/speech-balloon.png" alt="" /></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 11.6, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « Trois » 11.74 · « témoignage » 12.38 · « avis » 13.50 · « retour d'expérience » 14.14–14.46 · « recommandation » 15.42
          tl.fromTo("#s4-cam", { y: 800, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 0);
          tl.fromTo("#s4-num", { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.4)" }, at(11.65));
          PX.letters(tl, "#s4-title", at(12.2), { y: 70, stagger: 0.025, dur: 0.4 }).slice(3).forEach((c) => (c.style.color = "#E2718D"));
          tl.fromTo("#s4-rev", { y: 200, opacity: 0, rotationX: -30 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.55, ease: "expo.out", transformPerspective: 1400 }, at(12.5));
          tl.fromTo("#s4-bub", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, at(12.45));
          PX.float(tl, "#s4-bubw", at(12.95), 3.0, 10, 1.3, 6);
          tl.fromTo("#s4-avi", { y: 80 }, { y: 0, duration: 0.45, ease: "back.out(2)" }, at(12.7));
          gsap.utils.toArray("#s4-stars .s4-st").forEach((s, i) =>
            tl.fromTo(s, { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, at(13.35 + i * 0.09)));
          PX.burst(tl, "#s4-cam", 470, 790, at(13.8), { n: 12, r: 260, size: 16, seed: 71 });
          tl.fromTo("#s4-l1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.35 }, at(14.0));
          const q = document.querySelector("#s4-quote"), Q = "« J'ai adoré la texture, je le refais tous les jours. »";
          const ty = { _v: 0, get v() { return this._v; }, set v(x) { this._v = x; q.textContent = Q.slice(0, Math.round(x)); } };
          tl.fromTo(ty, { v: 0 }, { v: Q.length, duration: 1.2, ease: "none" }, at(14.15));
          tl.fromTo("#s4-rec", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.4)" }, at(15.3));
          tl.fromTo("#s4-th", { rotation: -50 }, { rotation: 0, duration: 0.5, ease: "back.out(3)" }, at(15.4));
          PX.pulse(tl, "#s4-rec", at(15.8), 0.25, 1.05, 0.25);
          tl.to("#s4-cam", { x: -1080, filter: "blur(16px)", duration: 0.26, ease: "power3.in" }, at(15.84));
          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
