<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s1-cam { position: absolute; inset: 0; }
        #s1-four { position: absolute; left: 64px; right: 120px; top: 250px; text-align: center; font: 700 560px/1 "PxSerif", serif; color: #E2718D; display: block; }
        #s1-fmt { position: absolute; left: 64px; right: 120px; top: 820px; text-align: center; font-size: 120px; display: block; padding-bottom: 12px; }
        .s1-ow { position: absolute; width: 190px; height: 190px; display: block; }
        .s1-o { width: 190px; height: 190px; }
        #s1-o1 { left: 70px; top: 300px; }
        #s1-o2 { left: 760px; top: 290px; }
        #s1-o3 { left: 90px; top: 640px; }
        #s1-o4 { left: 750px; top: 630px; }
        #s1-red { position: absolute; left: 112px; top: 1010px; width: 800px; height: 230px; display: flex; align-items: center; gap: 30px; padding: 0 40px; }
        #s1-bag { width: 170px; height: 170px; flex: none; }
        #s1-rt { font-size: 60px; line-height: 1.1; display: block; }
        #s1-heart { position: absolute; left: 820px; top: 960px; width: 130px; height: 130px; }
      </style>
      <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div id="s1-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s1-four">4</div>
          <div id="s1-o1" class="s1-ow"><img class="s1-o img3d" src="assets/lib/emoji/movie-camera.png" alt="" /></div>
          <div id="s1-o2" class="s1-ow"><img class="s1-o img3d" src="assets/lib/emoji/camera-with-flash.png" alt="" /></div>
          <div id="s1-o3" class="s1-ow"><img class="s1-o img3d" src="assets/lib/emoji/speech-balloon.png" alt="" /></div>
          <div id="s1-o4" class="s1-ow"><img class="s1-o img3d" src="assets/lib/emoji/mobile-phone.png" alt="" /></div>
          <div id="s1-fmt" class="t-serif">formats</div>
          <div id="s1-red" class="card"><img id="s1-bag" class="img3d" src="assets/lib/emoji/shopping-bags.png" alt="" /><span id="s1-rt" class="t-serif">Les marques en <span class="acc">redemandent</span></span></div>
          <img id="s1-heart" class="img3d" src="assets/lib/emoji/smiling-face-with-heart-eyes.png" alt="" />
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // « Quatre » 0.30 · « formats » 0.65 · « marques » 1.45 · « redemandent » 1.93
          tl.fromTo("#s1-four", { scale: 1.8, opacity: 0.35, filter: "blur(10px)", rotation: -8 }, { scale: 1, opacity: 1, filter: "blur(0px)", rotation: 0, duration: 0.45, ease: "expo.out" }, 0.0);
          tl.fromTo("#s1-cam", { x: 0 }, { x: 14, duration: 0.05, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, 0.45);
          PX.burst(tl, "#s1-cam", 512, 560, 0.4, { n: 18, r: 420, seed: 4 });
          ["#s1-o1", "#s1-o2", "#s1-o3", "#s1-o4"].forEach((o, i) => {
            tl.fromTo(o + " .s1-o", { scale: 0, rotation: i % 2 ? 60 : -60 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.6)" }, 0.45 + i * 0.08);
            PX.float(tl, o, 0.95 + i * 0.08, 1.4, 10 + i * 2, 1.0 + i * 0.15, 6);
          });
          PX.letters(tl, "#s1-fmt", 0.55, { y: 80, stagger: 0.03, dur: 0.4 });
          tl.fromTo("#s1-red", { y: 160, opacity: 0, rotationX: -40 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.5, ease: "expo.out", transformPerspective: 1200 }, 1.3);
          tl.fromTo("#s1-bag", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.6)" }, 1.4);
          tl.fromTo("#s1-heart", { scale: 0, rotation: 40 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, 1.85);
          tl.fromTo("#s1-four", { scale: 1 }, { scale: 1.06, duration: 1.6, ease: "none", immediateRender: false }, 0.7);
          tl.to("#s1-cam", { scale: 1.6, opacity: 0, filter: "blur(16px)", duration: 0.22, ease: "power3.in" }, 2.4);
          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
