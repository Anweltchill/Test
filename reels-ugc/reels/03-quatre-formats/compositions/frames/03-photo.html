<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <script src="assets/fx.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s3-cam { position: absolute; inset: 0; }
        #s3-head { position: absolute; left: 90px; top: 280px; display: flex; align-items: center; gap: 30px; }
        #s3-num { width: 150px; height: 150px; border-radius: 50%; background: #0E1928; color: #FDF4ED; display: flex; align-items: center; justify-content: center; font: 700 76px "PxSerif", serif; flex: none; }
        #s3-title { font-size: 128px; display: block; white-space: nowrap; }
        #s3-camw { position: absolute; left: 372px; top: 470px; width: 280px; height: 280px; display: block; }
        #s3-camimg { width: 280px; height: 280px; }
        #s3-flash { position: absolute; inset: -100px; background: #FFFFFF; opacity: 0; display: block; }
        .s3-pol { position: absolute; top: 800px; width: 290px; height: 380px; background: #FFFFFF; border-radius: 14px; padding: 18px 18px 0; box-shadow: 0 22px 50px rgba(14,25,40,0.18); display: block; }
        #s3-p1 { left: 70px; }
        #s3-p2 { left: 370px; }
        #s3-p3 { left: 670px; }
        .s3-pic { width: 254px; height: 254px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        .s3-pi { width: 190px; height: 190px; }
        .s3-pt { display: block; text-align: center; font-size: 36px; margin-top: 22px; white-space: nowrap; }
      </style>
      <div id="root" data-composition-id="s3" data-width="1080" data-height="1920">
        <div id="s3-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s3-head"><span id="s3-num">2</span><span id="s3-title" class="t-serif">La <span class="acc">photo</span></span></div>
          <div id="s3-camw"><img id="s3-camimg" class="img3d" src="assets/lib/emoji/camera-with-flash.png" alt="" /></div>
          <div id="s3-p1" class="s3-pol"><div class="s3-pic" style="background:#E6BDC1"><img class="s3-pi img3d" src="assets/lib/emoji/lipstick.png" alt="" /></div><span class="s3-pt t-serif">Mise en situation</span></div>
          <div id="s3-p2" class="s3-pol"><div class="s3-pic" style="background:#C2C7DD"><img class="s3-pi img3d" src="assets/lib/emoji/magnifying-glass-tilted-left.png" alt="" /></div><span class="s3-pt t-serif">Détails</span></div>
          <div id="s3-p3" class="s3-pol"><div class="s3-pic" style="background:#F0E6DD"><img class="s3-pi img3d" src="assets/lib/emoji/candle.png" alt="" /></div><span class="s3-pt t-serif">Ambiance</span></div>
          <div id="s3-flash"></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 7.3, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « Deux » 7.45 · « photo » 8.17 · « Mise en situation » 8.81–9.29 · « détails » 10.01 · « ambiance » 10.81
          tl.fromTo("#s3-cam", { x: 1080, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 0);
          tl.fromTo("#s3-num", { scale: 0, rotation: 180 }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.4)" }, at(7.35));
          tl.fromTo("#s3-title", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, at(8.0));
          tl.fromTo("#s3-camimg", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.4)" }, at(7.75));
          tl.fromTo("#s3-camimg", { scale: 1 }, { scale: 0.88, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.in", immediateRender: false }, at(8.15));
          tl.fromTo("#s3-flash", { opacity: 0 }, { opacity: 0.85, duration: 0.06, ease: "none" }, at(8.2));
          tl.to("#s3-flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, at(8.26));
          PX.float(tl, "#s3-camw", at(8.5), 2.8, 10, 1.4, 4);
          [["#s3-p1", 8.65, -8], ["#s3-p2", 9.85, 3], ["#s3-p3", 10.65, 9]].forEach(([p, t, r], i) => {
            tl.fromTo(p, { y: -900, rotation: r * 4, opacity: 0 }, { y: 0, rotation: r, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, at(t));
            tl.fromTo(p + " .s3-pi", { scale: 0.3 }, { scale: 1, duration: 0.5, ease: "back.out(2.6)" }, at(t + 0.25));
            PX.burst(tl, "#s3-cam", [215, 515, 815][i], 990, at(t + 0.5), { n: 8, r: 150, size: 14, seed: 60 + i });
          });
          tl.to("#s3-cam", { y: -500, scale: 1.2, opacity: 0, filter: "blur(14px)", duration: 0.28, ease: "power3.in" }, at(11.32));
          window.__timelines["s3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
