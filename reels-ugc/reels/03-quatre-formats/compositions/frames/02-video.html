      <div id="root" data-composition-id="s2" data-width="1080" data-height="1920">
        <div id="s2-cam" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="s2-head"><span id="s2-num">1</span><span id="s2-title" class="t-serif">La <span class="acc">vidéo</span></span></div>
          <div id="s2-ph"><div id="s2-scr">
            <img id="s2-tt" src="assets/lib/logos/tiktok-icon.svg" alt="" />
            <div id="s2-prodw"><img id="s2-prod" class="img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /></div>

          <div id="s2-c1" class="s2-chip card"><img class="s2-ci img3d" src="assets/lib/emoji/lotion-bottle.png" alt="" /><span class="s2-ct t-serif">Test produit</span></div>
          <div id="s2-c2" class="s2-chip card"><img class="s2-ci img3d" src="assets/lib/emoji/woman-teacher.png" alt="" /><span class="s2-ct t-serif">Tutoriel</span></div>
          <div id="s2-c3" class="s2-chip card"><img class="s2-ci img3d" src="assets/lib/emoji/alarm-clock.png" alt="" /><span class="s2-ct t-serif">Routine</span></div>
          <div id="s2-c4" class="s2-chip card"><img class="s2-ci img3d" src="assets/lib/emoji/package.png" alt="" /><span class="s2-ct t-serif">Unboxing</span></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 2.6, at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // « Un » 2.81 · « vidéo » 3.45 · « Test produit » 4.09 · « tutoriel » 5.13 · « routine » 5.93 · « unboxing » 6.57
          tl.fromTo("#s2-cam", { scale: 0.5, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 0);
          tl.fromTo("#s2-num", { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, at(2.62));
          tl.fromTo("#s2-title", { opacity: 0 }, { opacity: 0.35, duration: 0.2 }, at(2.7));
          tl.fromTo("#s2-title", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, at(3.3));
          tl.fromTo("#s2-ph", { y: 900, rotation: -10 }, { y: 0, rotation: -3, duration: 0.7, ease: "expo.out" }, at(3.4));
          tl.fromTo("#s2-play", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, at(3.9));
          tl.to("#s2-play", { scale: 0, opacity: 0, duration: 0.25 }, at(4.3));
          tl.fromTo("#s2-fill", { scaleX: 0 }, { scaleX: 1, duration: 2.8, ease: "none" }, at(4.3));
          tl.fromTo("#s2-prod", { scale: 0.4, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2)" }, at(3.95));
          PX.float(tl, "#s2-prodw", at(4.55), 2.6, 14, 1.3, 8);
          const chips = ["#s2-c1", "#s2-c2", "#s2-c3", "#s2-c4"], times = [3.95, 5.0, 5.8, 6.42];
          chips.forEach((c, i) => {
            tl.fromTo(c, { x: 600, opacity: 0, rotationY: -60 }, { x: 0, opacity: 1, rotationY: 0, duration: 0.5, ease: "expo.out", transformPerspective: 1200 }, at(times[i]));
            tl.fromTo(c + " .s2-ci", { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, at(times[i] + 0.1));
          });
          tl.fromTo("#s2-ph", { rotation: -3 }, { rotation: 3, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, at(4.2));
          tl.to("#s2-cam", { x: -1080, filter: "blur(16px)", duration: 0.26, ease: "power3.in" }, at(7.04));
          window.__timelines["s2"] = tl;
        })();
