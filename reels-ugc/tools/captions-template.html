<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <script src="assets/gsap.min.js"></script>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .cap-g { position: absolute; left: 64px; right: 120px; top: 1400px; text-align: center; opacity: 0; display: block; }
        .cap-w { position: relative; display: inline-block; margin: 0 6px; font: 600 58px "PxSans", sans-serif; color: #0E1928; padding: 4px 14px; }
        .cap-bg { position: absolute; inset: 0; border-radius: 16px; background: #E6BDC1; opacity: 0; display: block; }
        .cap-t { position: relative; display: inline-block; }
      </style>
      <div id="root" data-composition-id="cap" data-width="1080" data-height="1920">
        <div id="cap-box"></div>
      </div>
      <script>
        (function () {
          const G = __DATA__;
          const END = __END__;
          const box = document.querySelector("#cap-box");
          const tl = gsap.timeline({ paused: true });
          G.forEach((g, gi) => {
            const el = document.createElement("div");
            el.className = "cap-g";
            el.id = "cap-g" + gi;
            g.forEach((w, wi) => {
              const s = document.createElement("span");
              s.className = "cap-w";
              s.innerHTML = '<span class="cap-bg"></span><span class="cap-t"></span>';
              s.querySelector(".cap-t").textContent = w[0];
              el.appendChild(s);
            });
            box.appendChild(el);
            const t0 = Math.max(0, g[0][1] - 0.06);
            const t1 = gi + 1 < G.length ? Math.max(t0 + 0.2, G[gi + 1][0][1] - 0.06) : END;
            tl.fromTo(el, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.14, ease: "power2.out" }, t0);
            if (gi + 1 < G.length) tl.to(el, { opacity: 0, duration: 0.06 }, t1 - 0.06);
            const words = el.querySelectorAll(".cap-w");
            g.forEach((w, wi) => {
              const bg = words[wi].querySelector(".cap-bg");
              const wEnd = wi + 1 < g.length ? g[wi + 1][1] : t1;
              tl.fromTo(bg, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.1, ease: "back.out(2)" }, Math.max(t0, w[1] - 0.03));
              if (wi + 1 < g.length) tl.to(bg, { opacity: 0, duration: 0.08 }, Math.max(t0 + 0.05, wEnd - 0.03));
            });
          });
          window.__timelines["cap"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
